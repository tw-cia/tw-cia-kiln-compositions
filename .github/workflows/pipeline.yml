# Kiln pipeline.
#
# 1. kcl test .                 (no Docker, no cluster)
# 2. kiln generate-all          regenerates the Composition and XRD
#    kiln render-all            renders every kind (needs Docker and the crossplane CLI)
#    saves the generated manifests as a workflow artifact
# 3. list pods across all namespaces on the cia-test EKS cluster, via an assumed AWS role

name: pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets configure-aws-credentials exchange a GitHub OIDC token for the role

env:
  AWS_ROLE_ARN: arn:aws:iam::160071257600:role/cia-test-github-actions
  AWS_REGION: ap-southeast-1
  EKS_CLUSTER_NAME: cia-test

jobs:
  kcl-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install kcl
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$KCL_VERSION" -R kcl-lang/cli -p "kcl-$KCL_VERSION-linux-amd64.tar.gz" -p "cli_${KCL_VERSION#v}_checksums.txt"
          grep " kcl-$KCL_VERSION-linux-amd64.tar.gz\$" "cli_${KCL_VERSION#v}_checksums.txt" | sha256sum -c -
          tar -xzf "kcl-$KCL_VERSION-linux-amd64.tar.gz" kcl
          sudo install -m 0755 kcl /usr/local/bin/kcl
          kcl version
        env:
          GH_TOKEN: ${{ github.token }}
          KCL_VERSION: v0.13.2
      - name: kcl test
        working-directory: kcl-scripts
        run: kcl test .

  generate-render:
    needs: kcl-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: install kcl
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$KCL_VERSION" -R kcl-lang/cli -p "kcl-$KCL_VERSION-linux-amd64.tar.gz" -p "cli_${KCL_VERSION#v}_checksums.txt"
          grep " kcl-$KCL_VERSION-linux-amd64.tar.gz\$" "cli_${KCL_VERSION#v}_checksums.txt" | sha256sum -c -
          tar -xzf "kcl-$KCL_VERSION-linux-amd64.tar.gz" kcl
          sudo install -m 0755 kcl /usr/local/bin/kcl
          kcl version
        env:
          GH_TOKEN: ${{ github.token }}
          KCL_VERSION: v0.13.2
      - name: install crossplane CLI
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://cli.crossplane.io/stable/$XP_VERSION/bin/linux_amd64"
          curl -sfL -o crossplane "$base/crossplane"
          curl -sfL -o crossplane.sha256 "$base/crossplane.sha256"
          echo "$(cut -d' ' -f1 crossplane.sha256)  crossplane" | sha256sum -c -
          sudo install -m 0755 crossplane /usr/local/bin/crossplane
          crossplane version --client
        env:
          XP_VERSION: v2.5.0
      - name: install kiln
        run: |
          set -euo pipefail
          uv tool install "git+https://github.com/leprechaun/kiln#subdirectory=tooling"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: kiln pull-crds
        # crds/ is git-ignored, so a fresh checkout has none; render-all needs them.
        run: kiln pull-crds
      - name: kiln generate-all
        run: kiln generate-all
      - name: kiln render-all
        run: kiln render-all
      - name: upload manifests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manifests
          path: manifests/crossplane-compositions/**/*.yaml

  list-pods:
    name: apply manifests
    needs: generate-render
    runs-on: ubuntu-latest
    steps:
      - name: Show OIDC sub
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref}'
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: update kubeconfig for cia-test
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: download manifests
        uses: actions/download-artifact@v8
        with:
          name: manifests
          path: manifests-download
      - name: apply manifests
        run: kubectl apply -R -f manifests-download
      - name: list all
        run: kubectl get all --all-namespaces
      - name: list matching claims
        # The kinds we built are namespaced composite resources (no claimNames in the XRDs),
        # so their instances are listed directly.
        run: |
          kubectl get cdndistributions,environments,staticwebsites,tlscertificates,webfleets --all-namespaces
