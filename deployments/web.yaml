# A web service in vpc-0d1a71fdd00386682 (cia-test, ap-southeast-1): nginx on Debian 12 behind an
# HTTPS load balancer, at web.trololo.demotw.com.
# Load balancer: the public subnets. Instances: the private subnets, which reach the internet
# through NAT so the boot script can install nginx.
# Apply after the WebService, AutoScalingGroup and LoadBalancer XRDs and Compositions are installed.
apiVersion: platform.demotw.com/v1alpha1
kind: WebService
metadata:
  name: web
spec:
  domainName: web.trololo.demotw.com
  hostedZoneId: Z0510802PA88E7HZZ597
  region: ap-southeast-1
  vpcId: vpc-0d1a71fdd00386682
  loadBalancerSubnetIds:
    - subnet-053b0cb241f26ca4c # public, ap-southeast-1b
    - subnet-0dd1501720b3d186f # public, ap-southeast-1a
  loadBalancerSecurityGroupIds:
    - sg-01c8f00fb293085e7 # web-lb-sg: 443 from the internet
  instanceSubnetIds:
    - subnet-03fe35a36c221d2fb # private, ap-southeast-1a
    - subnet-05fb07c62d75e993b # private, ap-southeast-1b
  instanceSecurityGroupIds:
    - sg-0ed32e2a870932046 # web-instance-sg: 80 from web-lb-sg only
  # Debian 12 (bookworm), amd64, ap-southeast-1, published by Debian (owner 136693071363).
  imageId: ami-0b220b5c3dad9b55a
  instanceType: t3.micro
  minSize: 2
  maxSize: 3
  desiredCapacity: 2
  targetPort: 80
  userData: |
    #!/bin/bash
    set -euo pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y nginx
    cat > /var/www/html/index.html <<'HTML'
    <!doctype html>
    <html>
      <head><meta charset="utf-8"><title>Hello from Debian</title></head>
      <body>
        <h1>Hello from nginx on Debian</h1>
        <p>Served by an instance in an auto-scaling group behind a load balancer.</p>
      </body>
    </html>
    HTML
    systemctl enable --now nginx
