apiVersion: platform.demotw.com/v1alpha1
kind: WebFleet
metadata:
  name: web-fleet
spec:
  name: web
  domain:
    name: web.example.com
    hostedZoneId: Z0123456789ABCDEFGHIJ
  network:
    vpcId: vpc-0123456789abcdef0
    publicSubnetIds:
      - subnet-aaaa1111
      - subnet-bbbb2222
    privateSubnetIds:
      - subnet-cccc3333
      - subnet-dddd4444
  imageId: ami-0123456789abcdef0
  instanceType: t3.small
  minSize: 1
  maxSize: 3
  userData: |
    #!/bin/bash
    echo "hello from the fleet"
  scalingSchedules:
    - name: morning
      recurrence: "0 8 * * MON-FRI"
      timeZone: Europe/London
      minSize: 2
      maxSize: 3
    - name: night
      recurrence: "0 20 * * *"
      minSize: 1
      maxSize: 2
