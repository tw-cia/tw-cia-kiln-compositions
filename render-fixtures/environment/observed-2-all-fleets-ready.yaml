    - type: Ready
      status: "True"
---
apiVersion: platform.demotw.com/v1alpha1
kind: WebFleet
metadata:
  name: prod-environment-api-fleet
  annotations:
    crossplane.io/composition-resource-name: web-fleet-api
status:
  loadBalancerArn: arn:aws:elasticloadbalancing:us-east-1:111111111111:loadbalancer/app/prod-api/fedcba
  loadBalancerDnsName: prod-api-654321.us-east-1.elb.amazonaws.com
  conditions:
    - type: Ready
      status: "True"
