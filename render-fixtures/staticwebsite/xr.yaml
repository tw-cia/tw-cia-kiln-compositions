apiVersion: platform.example.com/v1alpha1
kind: StaticWebsite
metadata:
  name: example-website
spec:
  bucketName: my-website-bucket
  domainName: example.com
  region: us-east-1
  versioningEnabled: false
  blockPublicAccess: true
  enableLogging: false
  cacheTtl: 3600
  tags:
    Environment: production
    Application: website
