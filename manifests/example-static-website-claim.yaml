apiVersion: platform.demotw.com/v1
kind: WebsiteClaim
metadata:
  name: my-website
  namespace: default
spec:
  bucketName: my-awesome-website-bucket
  domainName: example.com
  indexDocument: index.html
  errorDocument: error.html
  enableLogging: false
  enableCloudFrontCompression: true
  cacheTTL: 3600
  resourceRef:
    name: my-website
