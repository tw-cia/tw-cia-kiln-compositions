apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: staticwebsites.platform.demotw.com
spec:
  group: platform.demotw.com
  names:
    kind: StaticWebsite
    plural: staticwebsites
  claimNames:
    kind: WebsiteClaim
    plural: websiteclaims
  versions:
  - name: v1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        description: A static website hosted on S3 with CloudFront distribution
        type: object
        properties:
          spec:
            type: object
            properties:
              bucketName:
                description: Name of the S3 bucket for the website
                type: string
              domainName:
                description: Domain name for the website
                type: string
              acmCertificateArn:
                description: ARN of the ACM certificate (optional)
                type: string
              indexDocument:
                description: Index document name (default index.html)
                type: string
                default: "index.html"
              errorDocument:
                description: Error document name (default error.html)
                type: string
                default: "error.html"
              enableLogging:
                description: Enable S3 logging
                type: boolean
                default: false
              logBucketName:
                description: S3 bucket for logs (required if enableLogging is true)
                type: string
              enableCloudFrontCompression:
                description: Enable compression on CloudFront
                type: boolean
                default: true
              cacheTTL:
                description: Default cache TTL in seconds
                type: integer
                default: 3600
            required:
            - bucketName
            - domainName
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: staticwebsite.aws.platform.demotw.com
spec:
  compositeTypeRef:
    apiVersion: platform.demotw.com/v1
    kind: StaticWebsite
  mode: Pipeline
  pipeline:
  - step: render-composition
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      spec:
        source: |
          import regex

          # Get parameters from the composite resource
          params = __args.observed.composite.resource.spec
          name = __args.observed.composite.resource.metadata.name

          # S3 Bucket Configuration
          bucket = {
              apiVersion: "s3.aws.upbound.io/v1beta1"
              kind: "Bucket"
              metadata: {
                  name: name
                  annotations: {
                      "crossplane.io/external-name": params.bucketName
                  }
              }
              spec: {
                  forProvider: {
                      region: "us-east-1"
                      acl: "private"
                  }
                  providerConfigRef: {
                      name: "aws-provider"
                  }
              }
          }

          # S3 Bucket Website Configuration
          bucketWebsite = {
              apiVersion: "s3.aws.upbound.io/v1beta1"
              kind: "BucketWebsite"
              metadata: {
                  name: name + "-website"
              }
              spec: {
                  forProvider: {
                      bucket: name
                      indexDocument: params.indexDocument
                      errorDocument: params.errorDocument
                      region: "us-east-1"
                  }
                  providerConfigRef: {
                      name: "aws-provider"
                  }
              }
          }

          # S3 Bucket Public Access Block (block public access initially)
          bucketPublicAccessBlock = {
              apiVersion: "s3.aws.upbound.io/v1beta1"
              kind: "BucketPublicAccessBlock"
              metadata: {
                  name: name + "-pab"
              }
              spec: {
                  forProvider: {
                      bucket: name
                      blockPublicAcls: true
                      blockPublicPolicy: true
                      ignorePublicAcls: true
                      restrictPublicBuckets: true
                      region: "us-east-1"
                  }
                  providerConfigRef: {
                      name: "aws-provider"
                  }
              }
          }

          # CloudFront Origin Access Identity
          oai = {
              apiVersion: "cloudfront.aws.upbound.io/v1beta1"
              kind: "OriginAccessIdentity"
              metadata: {
                  name: name + "-oai"
              }
              spec: {
                  forProvider: {
                      comment: "OAI for " + params.bucketName
                  }
                  providerConfigRef: {
                      name: "aws-provider"
                  }
              }
          }

          # S3 Bucket Policy to allow CloudFront access
          bucketPolicy = {
              apiVersion: "s3.aws.upbound.io/v1beta1"
              kind: "BucketPolicy"
              metadata: {
                  name: name + "-policy"
              }
              spec: {
                  forProvider: {
                      bucket: name
                      policy: """{
                          "Version": "2012-10-17",
                          "Statement": [
                              {
                                  "Effect": "Allow",
                                  "Principal": {
                                      "AWS": "arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${oai.status.atProvider.id}"
                                  },
                                  "Action": "s3:GetObject",
                                  "Resource": "arn:aws:s3:::{bucket_name}/*"
                              }
                          ]
                      }""".format(bucket_name=params.bucketName)
                      region: "us-east-1"
                  }
                  providerConfigRef: {
                      name: "aws-provider"
                  }
              }
          }

          # CloudFront Distribution
          distribution = {
              apiVersion: "cloudfront.aws.upbound.io/v1beta1"
              kind: "Distribution"
              metadata: {
                  name: name + "-dist"
              }
              spec: {
                  forProvider: {
                      enabled: true
                      isIpv6Enabled: true
                      comment: "CloudFront distribution for " + params.domainName
                      defaultRootObject: params.indexDocument
                      origin: [
                          {
                              domainName: params.bucketName + ".s3.amazonaws.com"
                              originId: "S3Origin"
                              s3OriginConfig: [
                                  {
                                      originAccessIdentity: "origin-access-identity/cloudfront/" + name + "-oai"
                                  }
                              ]
                          }
                      ]
                      defaultCacheBehavior: [
                          {
                              allowedMethods: ["GET", "HEAD", "OPTIONS"]
                              cachedMethods: ["GET", "HEAD"]
                              targetOriginId: "S3Origin"
                              compress: params.enableCloudFrontCompression
                              forwardedValues: [
                                  {
                                      queryString: false
                                      cookies: [
                                          {
                                              forward: "none"
                                          }
                                      ]
                                  }
                              ]
                              viewerProtocolPolicy: "redirect-to-https"
                              defaultTtl: params.cacheTTL
                              maxTtl: params.cacheTTL * 2
                              minTtl: 0
                          }
                      ]
                      restrictions: [
                          {
                              geoRestriction: [
                                  {
                                      restrictionType: "none"
                                  }
                              ]
                          }
                      ]
                      viewerCertificate: [
                          {
                              cloudFrontDefaultCertificate: true
                          }
                      ]
                  }
                  providerConfigRef: {
                      name: "aws-provider"
                  }
              }
          }

          # Return all resources
          _resource_list = [bucket, bucketWebsite, bucketPublicAccessBlock, oai, bucketPolicy, distribution]

          if params.enableLogging and params.logBucketName:
              bucketLogging = {
                  apiVersion: "s3.aws.upbound.io/v1beta1"
                  kind: "BucketLogging"
                  metadata: {
                      name: name + "-logging"
                  }
                  spec: {
                      forProvider: {
                          bucket: name
                          targetBucket: params.logBucketName
                          targetPrefix: "logs/"
                          region: "us-east-1"
                      }
                      providerConfigRef: {
                          name: "aws-provider"
                      }
                  }
              }
              _resource_list = _resource_list + [bucketLogging]

          _resource_list
  - step: auto-ready
    functionRef:
      name: function-auto-ready
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      spec:
        source: |
          __args.observed.resources
