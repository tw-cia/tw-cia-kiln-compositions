apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: cdndistributions.platform.example.com
spec:
  group: platform.example.com
  names:
    kind: CdnDistribution
    plural: cdndistributions
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            properties:
              domain:
                properties:
                  hostedZoneId:
                    type: string
                  name:
                    type: string
                required:
                - name
                - hostedZoneId
                type: object
              origin:
                type: object
                properties:
                  bucketName:
                    type: string
                  region:
                    default: us-east-1
                    type: string
                  domainName:
                    type: string
                oneOf:
                - required:
                  - bucketName
                - required:
                  - domainName
              priceClass:
                default: PriceClass_100
                type: string
            required:
            - domain
            - origin
            type: object
          status:
            properties:
              distributionArn:
                type: string
              domainName:
                type: string
            type: object
