          # Your composite resource (XR) spec schemas, one per kind, e.g. `schema MyKindSpec:`.

          # A public TLS certificate for one domain, issued by ACM and validated through
          # DNS records in a Route 53 hosted zone. CloudFront only accepts certificates
          # from us-east-1, so keep the default region when the certificate is for a
          # CdnDistribution.
          schema TlsCertificateSpec:
              domainName: str
              hostedZoneId: str
              region: str = "us-east-1"

          # certificateArn is set once ACM has created the certificate. validated is true
          # once ACM reports the DNS validation as complete.

          # One change to the fleet's size, that AWS applies on a cron schedule. recurrence
          # is a Unix cron expression, for example "0 8 * * MON-FRI" for 08:00 on weekdays,
          # and timeZone is an IANA name such as "Europe/London" (UTC when it is left out).
          # Set at least one of minSize, maxSize or desiredCapacity. A value left out is
          # not changed at that time.
          schema ScalingScheduleSpec:
              name: str
              recurrence: str
              timeZone?: str
              minSize?: int
              maxSize?: int
              desiredCapacity?: int
              check:
                  minSize is not Undefined or maxSize is not Undefined or desiredCapacity is not Undefined, "a scaling schedule must set minSize, maxSize or desiredCapacity"

          # The application part of a web fleet: an auto-scaling group of web instances
          # behind an application load balancer, and what they run. It does not say which
          # network the fleet runs in, so an Environment can supply that.
          # domain is the address the fleet serves HTTPS on. The fleet gets a certificate for
          # it in its own region, and HTTP on port 80 redirects to HTTPS.
          # userData is a plain-text bootstrap script (cloud-init or a shell script); the
          # launch template receives it base64-encoded, as EC2 requires.
          schema WebFleetAppSpec:
              name: str
              domain: DomainSpec
              imageId: str
              instanceType: str = "t3.micro"
              port: int = 80
              healthCheckPath: str = "/"
              minSize: int = 1
              maxSize: int = 2
              userData?: str
              scalingSchedules?: [ScalingScheduleSpec]
              check:
                  minSize <= maxSize, "minSize must not be greater than maxSize"

          # A web fleet placed in a network: WebFleetAppSpec plus the region and the network.
          schema WebFleetSpec(WebFleetAppSpec):
              region: str = "us-east-1"
              network: NetworkSpec

          # loadBalancerDnsName is the load balancer's own DNS name. A CdnDistribution's
          # origin is the fleet's domain instead, which its certificate covers.

          # An S3 bucket that the distribution serves, read through an origin access control.
          # The bucket is private: only this distribution may read it. name must be unique
          # across all of AWS.
          schema S3OriginSpec:
              bucketName: str
              region: str

          # An HTTPS origin that already exists: a name it serves HTTPS on, with a certificate
          # for that name, such as a WebFleet's domain.
          schema HttpsOriginSpec:
              domainName: str

          # Where a distribution's content comes from: an S3 bucket it creates, or an HTTPS
          # origin that already exists. Give exactly one. The fields do not overlap, so the
          # closed schemas tell the two forms apart.
          type OriginSpec = S3OriginSpec | HttpsOriginSpec

          # A CloudFront distribution serving content from one origin at domain. The domain's
          # certificate is created and validated by DNS, as a child TlsCertificate. Viewers are
          # redirected to HTTPS.
          schema CdnDistributionSpec:
              domain: DomainSpec
              origin: OriginSpec
              priceClass: str = "PriceClass_100"

          schema CdnDistributionStatus:
              distributionArn?: str
              domainName?: str

          # The VPC and subnets that resources run in. The subnets must already exist:
          # public ones for internet-facing load balancers, private ones for instances and
          # databases. Two or more in each tier, in different zones.
          schema NetworkSpec:
              vpcId: str
              publicSubnetIds: [str]
              privateSubnetIds: [str]
              check:
                  len(publicSubnetIds) >= 2, "publicSubnetIds needs at least two subnets, in different zones"
                  len(privateSubnetIds) >= 2, "privateSubnetIds needs at least two subnets, in different zones"

          # A VPC to create, from a CIDR block, across two or more zones. Not supported yet:
          # an Environment that asks for one is rejected until the create path exists.
          schema CreateVpcSpec:
              cidrBlock: str
              availabilityZones: [str]
              check:
                  len(availabilityZones) >= 2, "availabilityZones needs at least two zones"

          # An environment's network: a VPC and subnets that already exist (NetworkSpec), or
          # a VPC to create (CreateVpcSpec). Exactly one of the two is given.
          type EnvironmentNetwork = NetworkSpec | CreateVpcSpec

          # An environment, such as prod, that holds a network and the applications that
          # run in it. Each application's AWS names are prefixed with the environment name,
          # so two environments can share a region. Application names must be unique.

          # webFleetDnsNames maps each web fleet's application name to its load balancer's
          # DNS name, for the fleets whose load balancer exists.

          # A domain a consumer serves something at: name is the domain (such as
          # docs.example.com), and hostedZoneId is the Route 53 zone that holds it. The zone
          # takes the certificate's validation records and the alias records to the service.
          schema DomainSpec:
              name: str
              hostedZoneId: str

          # The bucket that holds the site's files. name must be unique across all of AWS.
          # Only the site's CloudFront distribution may read it.

          # A static website: files in a private S3 bucket, served over HTTPS at the domain
          # by a CloudFront distribution. The certificate is a TlsCertificate for the domain,
          # validated by DNS in the domain's hosted zone.

          # distribution holds what CloudFront reports once it has the distribution: its ARN,
          # and the address it answers on (such as d111111abcdef8.cloudfront.net).

          import json
          # CdnDistribution: a CloudFront distribution serving one origin at a domain.
          #   HTTPS origin (a WebFleet's domain): CloudFront reaches it over HTTPS, caches
          #     nothing and forwards everything, since the origin is a dynamic application.
          #   S3 origin: this kind creates a private bucket and reaches it through an origin
          #     access control. The bucket policy lets only this distribution read it, and
          #     content is cached, with index.html as the default page.
          # Staged by what is observed, as the cluster reports it:
          #   cold start                     -> certificate, plus the bucket and access control for S3
          #   bucket exists                  -> public access block (S3)
          #   certificate validated, origin ready -> distribution
          #   distribution ARN known         -> bucket policy (S3)
          #   distribution domain name known -> alias record and status
          composeCdnDistribution = lambda oxr, ocds -> [any] {
              spec: CdnDistributionSpec = oxr.spec

              # Bind XR values to locals before building resource dicts (see kcl-primer).
              _domainName = spec.domain.name
              _hostedZoneId = spec.domain.hostedZoneId
              _priceClass = spec.priceClass

              # The origin is read untyped, so the branch can see which form was given.
              _origin = oxr.spec.origin
              _isS3 = "bucketName" in _origin
              _bucketName = _origin?.bucketName
              _bucketRegion = _origin?.region or "us-east-1"
              _originDomainName = _origin?.domainName

              _certificateName = "certificate"
              _bucketResourceName = "bucket"
              _publicAccessBlockName = "public-access-block"
              _oacName = "origin-access-control"
              _distributionName = "distribution"
              _bucketPolicyName = "bucket-policy"
              _aliasRecordName = "alias-record"
              _originId = "origin"

              # The certificate is a child XR: a TlsCertificate for the domain. CloudFront only
              # accepts certificates from us-east-1.
              _certificate = {
                  apiVersion = "platform.demotw.com/v1alpha1"
                  kind = "TlsCertificate"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = _certificateName}
                  spec = TlsCertificateSpec {
                      domainName = _domainName
                      hostedZoneId = _hostedZoneId
                      region = "us-east-1"
                  }
              }

              # The certificate's status is read uncast: it also carries Crossplane's conditions.
              _certificateStatus = ocds[_certificateName]?.Resource?.status
              _certificateArn = _certificateStatus?.certificateArn
              _certificateValidated = _certificateStatus?.validated or False

              # --- S3 origin: resources exist only for a bucket origin ---------------------

              _bucket = {
                  apiVersion = "s3.aws.m.upbound.io/v1beta1"
                  kind = "Bucket"
                  metadata.annotations = {
                      "crossplane.io/external-name" = _bucketName
                      "krm.kcl.dev/composition-resource-name" = _bucketResourceName
                  }
                  spec.forProvider = S3AwsmUpboundIoV1beta1BucketSpecForProvider {
                      region = _bucketRegion
                  }
              } if _isS3 else None

              _bucketAtProvider = ocds[_bucketResourceName]?.Resource?.status?.atProvider
              _bucketArn = _bucketAtProvider?.arn
              _bucketRegionalDomainName = _bucketAtProvider?.bucketRegionalDomainName

              # Nothing in the bucket is public, whatever the bucket policy says.
              _publicAccessBlock = {
                  apiVersion = "s3.aws.m.upbound.io/v1beta1"
                  kind = "BucketPublicAccessBlock"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = _publicAccessBlockName}
                  spec.forProvider = S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProvider {
                      bucket = _bucketName
                      region = _bucketRegion
                      blockPublicAcls = True
                      blockPublicPolicy = True
                      ignorePublicAcls = True
                      restrictPublicBuckets = True
                  }
              } if _isS3 else None

              _oac = {
                  apiVersion = "cloudfront.aws.m.upbound.io/v1beta1"
                  kind = "OriginAccessControl"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = _oacName}
                  spec.forProvider = CloudfrontAwsmUpboundIoV1beta1OriginAccessControlSpecForProvider {
                      name = _bucketName
                      description = "Reads ${_bucketName} for the CloudFront distribution"
                      originAccessControlOriginType = "s3"
                      signingBehavior = "always"
                      signingProtocol = "sigv4"
                  }
              } if _isS3 else None

              _oacId = ocds[_oacName]?.Resource?.status?.atProvider?.id

              # --- distribution ---------------------------------------------------------------

              # An S3 origin needs its access control and bucket to exist; an HTTPS origin needs
              # only the certificate.
              _originReady = (_oacId and _bucketRegionalDomainName) if _isS3 else True
              _distributionReady = True if _certificateValidated and _originReady else False

              _distribution = {
                  apiVersion = "cloudfront.aws.m.upbound.io/v1beta1"
                  kind = "Distribution"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = _distributionName}
                  spec.forProvider = CloudfrontAwsmUpboundIoV1beta1DistributionSpecForProvider {
                      enabled = True
                      isIpv6Enabled = True
                      priceClass = _priceClass
                      aliases = [_domainName]
                      restrictions = {geoRestriction = {restrictionType = "none"}}
                      viewerCertificate = {
                          acmCertificateArn = _certificateArn
                          sslSupportMethod = "sni-only"
                          minimumProtocolVersion = "TLSv1.2_2021"
                      }
                      origin = [{
                          originId = _originId
                          domainName = _bucketRegionalDomainName if _isS3 else _originDomainName
                          **({"originAccessControlId" = _oacId} if _isS3 else {
                              customOriginConfig = {
                                  httpsPort = 443
                                  originProtocolPolicy = "https-only"
                                  originSslProtocols = ["TLSv1.2"]
                              }
                          })
                      }]
                      defaultCacheBehavior = {
                          targetOriginId = _originId
                          viewerProtocolPolicy = "redirect-to-https"
                          allowedMethods = ["GET", "HEAD", "OPTIONS"] if _isS3 else ["GET", "HEAD", "OPTIONS", "PUT", "POST", "PATCH", "DELETE"]
                          cachedMethods = ["GET", "HEAD"]
                          compress = True
                          # AWS managed policies, fixed global IDs documented by AWS:
                          # CachingOptimized for content, CachingDisabled for a dynamic origin.
                          cachePolicyId = "658327ea-f89d-4fab-a63d-7e88639e58f6" if _isS3 else "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
                          # AllViewer forwards every header, cookie and query string to a dynamic origin.
                          **({} if _isS3 else {originRequestPolicyId = "216adef6-5c7f-47e4-b989-5492eafa07d3"})
                      }
                      **({"defaultRootObject" = "index.html"} if _isS3 else {})
                  }
              } if _distributionReady else None

              _distributionAtProvider = ocds[_distributionName]?.Resource?.status?.atProvider
              _distributionArn = _distributionAtProvider?.arn
              _distributionDomainName = _distributionAtProvider?.domainName

              # Only this distribution may read the bucket, and only for requests it signs.
              _bucketPolicy = {
                  apiVersion = "s3.aws.m.upbound.io/v1beta1"
                  kind = "BucketPolicy"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = _bucketPolicyName}
                  spec.forProvider = S3AwsmUpboundIoV1beta1BucketPolicySpecForProvider {
                      bucket = _bucketName
                      region = _bucketRegion
                      policy = json.encode({
                          Version = "2012-10-17"
                          Statement = [{
                              Sid = "AllowCloudFrontServicePrincipalReadOnly"
                              Effect = "Allow"
                              Principal = {Service = "cloudfront.amazonaws.com"}
                              Action = ["s3:GetObject"]
                              Resource = "arn:aws:s3:::${_bucketName}/*"
                              Condition = {StringEquals = {"AWS:SourceArn" = _distributionArn}}
                          }]
                      })
                  }
              } if _isS3 and _distributionArn else None

              # The domain points at the distribution. CloudFront's hosted zone ID is fixed.
              _aliasRecord = {
                  apiVersion = "route53.aws.m.upbound.io/v1beta1"
                  kind = "Record"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = _aliasRecordName}
                  spec.forProvider = Route53AwsmUpboundIoV1beta1RecordSpecForProvider {
                      zoneId = _hostedZoneId
                      name = _domainName
                      $type = "A"
                      allowOverwrite = True
                      alias = Route53AwsmUpboundIoV1beta1RecordSpecForProviderAlias {
                          name = _distributionDomainName
                          zoneId = "Z2FDTNDATAQYW2"
                          evaluateTargetHealth = False
                      }
                  }
              } if _distributionDomainName else None

              _xr = {
                  apiVersion = oxr.apiVersion
                  kind = oxr.kind
                  metadata = oxr.metadata
                  status = CdnDistributionStatus {distributionArn = _distributionArn, domainName = _distributionDomainName}
              } if _distributionDomainName else None

              _s3Buckets = [_bucket] if _isS3 else []
              _s3Oacs = [_oac] if _isS3 else []
              _s3PublicAccessBlocks = [_publicAccessBlock] if _isS3 and _bucketArn else []
              _distributions = [_distribution] if _distributionReady else []
              _s3BucketPolicies = [_bucketPolicy] if _isS3 and _distributionArn else []
              _aliasRecords = [_aliasRecord] if _distributionDomainName else []
              _xrs = [_xr] if _xr else []

              [_certificate] + _s3Buckets + _s3Oacs + _s3PublicAccessBlocks + _distributions + _s3BucketPolicies + _aliasRecords + _xrs
          }

          _kilnSpecFields = ["domain", "origin", "priceClass"]
          _kilnObservedXr = option("params").oxr
          _kilnOxr = _kilnObservedXr | {spec = {k: v for k, v in _kilnObservedXr.spec if k in _kilnSpecFields}} if _kilnObservedXr?.spec else _kilnObservedXr
          _kilnProviderConfigRef = {kind = "ClusterProviderConfig", name = "pod-identity"}
          _kilnIsManaged = lambda r: any -> bool {
              "forProvider" in (r?.spec or {}) and not (r?.apiVersion or "").startswith("platform.demotw.com/")
          }
          _kilnWithProviderConfig = lambda r: any -> any {
              r | {spec.providerConfigRef = _kilnProviderConfigRef} if _kilnIsManaged(r) and not r?.spec?.providerConfigRef else r
          }
          items = [_kilnWithProviderConfig(r) for r in composeCdnDistribution(_kilnOxr, option("params").ocds)]
  - step: auto-ready
    functionRef:
      name: function-auto-ready
