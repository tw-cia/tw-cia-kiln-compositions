              tags?: {str:str}
              tagsAll?: {str:str}
              versioning?: S3AwsmUpboundIoV1beta1BucketAtProviderVersioning
              website?: S3AwsmUpboundIoV1beta1BucketAtProviderWebsite
              websiteDomain?: str
              websiteEndpoint?: str

          schema S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketRefPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketSelectorPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketRef:
              name: str
              namespace?: str
              policy?: S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketRefPolicy

          schema S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketSelector:
              matchControllerRef?: bool
              matchLabels?: {str:str}
              namespace?: str
              policy?: S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketSelectorPolicy

          schema S3AwsmUpboundIoV1beta1BucketPolicySpecForProvider:
              bucket?: str
              bucketRef?: S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketRef
              bucketSelector?: S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketSelector
              policy?: str
              region: str

          schema S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketRefPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketSelectorPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketRef:
              name: str
              namespace?: str
              policy?: S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketRefPolicy

          schema S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketSelector:
              matchControllerRef?: bool
              matchLabels?: {str:str}
              namespace?: str
              policy?: S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketSelectorPolicy

          schema S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProvider:
              blockPublicAcls?: bool
              blockPublicPolicy?: bool
              bucket?: str
              bucketRef?: S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketRef
              bucketSelector?: S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketSelector
              ignorePublicAcls?: bool
              region: str
              restrictPublicBuckets?: bool
              skipDestroy?: bool

          schema CloudfrontAwsmUpboundIoV1beta1OriginAccessControlSpecForProvider:
              description?: str
              name?: str
              originAccessControlOriginType?: str
              signingBehavior?: str
              signingProtocol?: str

          schema CloudfrontAwsmUpboundIoV1beta1OriginAccessControlStatusAtProvider:
              arn?: str
              description?: str
              etag?: str
              id?: str
              name?: str
              originAccessControlOriginType?: str
              signingBehavior?: str
              signingProtocol?: str

          # Your composite resource (XR) spec schemas, one per kind, e.g. `schema MyKindSpec:`.

          # A DNS-validated ACM certificate. CloudFront only accepts certificates from us-east-1,
          # which is the default.
          schema TlsCertificateSpec:
              domainName: str
              hostedZoneId: str
              subjectAlternativeNames?: [str]
              region: str = "us-east-1"

          # A static website served by CloudFront from a private S3 bucket, behind a custom domain.
          schema StaticWebsiteSpec:
              domainName: str
              hostedZoneId: str
              bucketName?: str
              bucketRegion: str = "us-east-1"
              indexDocument: str = "index.html"

          schema StaticWebsiteStatus:
              url?: str
              distributionDomainName?: str

          # An auto-scaling group of identical instances, built from a launch template.
          schema AutoScalingGroupSpec:
              region: str = "us-east-1"
              imageId: str
              instanceType: str = "t3.micro"
              subnetIds: [str]
              securityGroupIds?: [str]
              minSize: int = 1
              maxSize: int = 3
              desiredCapacity?: int
              # A plain-text boot script, run by each instance on launch. The function encodes it for AWS.
              userData?: str
              check:
                  minSize <= maxSize, "minSize must not be greater than maxSize"
                  desiredCapacity == Undefined or (desiredCapacity >= minSize and desiredCapacity <= maxSize), "desiredCapacity must be between minSize and maxSize"
                  userData == Undefined or len(userData) <= 16384, "userData must be at most 16 KB"

          # An application load balancer serving HTTPS with an existing DNS-validated certificate.

          # A complete web service: a DNS-validated certificate, an auto-scaling group, a load balancer
          # serving HTTPS with that certificate, and a DNS alias from the domain to the load balancer.
          # Everything about a web service except its name: where it runs and what it serves.
          # WebServiceSpec adds the name, and CdnWebServiceSpec nests one of these as its origin.
          schema WebServiceSettings:
              region: str = "us-east-1"
              vpcId: str
              # The load balancer is internet-facing, so it takes public subnets.
              loadBalancerSubnetIds: [str]
              loadBalancerSecurityGroupIds: [str]
              # The instances take private subnets with a route out, so they can install software at boot.
              instanceSubnetIds: [str]
              instanceSecurityGroupIds: [str]
              imageId: str
              instanceType: str = "t3.micro"
              minSize: int = 1
              maxSize: int = 3
              desiredCapacity?: int
              targetPort: int = 80
              # A plain-text boot script for each instance. See AutoScalingGroupSpec.
              userData?: str
              check:
                  len(loadBalancerSubnetIds) >= 2, "the load balancer needs at least two subnets"
                  minSize <= maxSize, "minSize must not be greater than maxSize"
                  desiredCapacity == Undefined or (desiredCapacity >= minSize and desiredCapacity <= maxSize), "desiredCapacity must be between minSize and maxSize"
                  userData == Undefined or len(userData) <= 16384, "userData must be at most 16 KB"

          schema WebServiceSpec(WebServiceSettings):
              domainName: str
              hostedZoneId: str

          # A web service served through CloudFront. The public name is a CloudFront alias with a us-east-1
          # certificate. CloudFront reaches the origin, a WebService at originDomainName, over HTTPS.
          schema CdnWebServiceSpec:
              domainName: str
              hostedZoneId: str
              originDomainName: str
              origin: WebServiceSettings
              check:
                  domainName != originDomainName, "the public name and the origin name must differ"

          import json
          staticWebsiteCertificateName = "certificate"
          staticWebsiteBucketResourceName = "bucket"
          staticWebsitePublicAccessBlockName = "bucket-public-access-block"
          staticWebsiteOriginAccessControlName = "origin-access-control"
          staticWebsiteDistributionName = "distribution"
          staticWebsiteBucketPolicyName = "bucket-policy"
          staticWebsiteAliasName = "website-a"
          staticWebsiteAliasAaaaName = "website-aaaa"

          # CloudFront's own hosted zone, used as the target of alias records.
          staticWebsiteCloudFrontZoneId = "Z2FDTNDATAQYW2"
          # AWS managed cache policy "CachingOptimized".
          staticWebsiteCachePolicyId = "658327ea-f89d-4fab-a63d-7e88639e58f6"

          # Reads observed resources through their imported status schemas, so a misspelt field is a compile error.
          staticWebsiteBucketObserved = lambda atProvider -> S3AwsmUpboundIoV1beta1BucketStatusAtProvider {
              _status: S3AwsmUpboundIoV1beta1BucketStatusAtProvider = atProvider
              _status
          }

          staticWebsiteOacObserved = lambda atProvider -> CloudfrontAwsmUpboundIoV1beta1OriginAccessControlStatusAtProvider {
              _status: CloudfrontAwsmUpboundIoV1beta1OriginAccessControlStatusAtProvider = atProvider
              _status
          }

          staticWebsiteDistributionObserved = lambda atProvider -> CloudfrontAwsmUpboundIoV1beta1DistributionStatusAtProvider {
              _status: CloudfrontAwsmUpboundIoV1beta1DistributionStatusAtProvider = atProvider
              _status
          }

          # One alias record (A or AAAA) for the site's domain, pointing at the distribution.
          staticWebsiteAliasRecord = lambda recordName, recordType, zoneId, domainName, distributionDomainName -> any {
              {
                  apiVersion = "route53.aws.m.upbound.io/v1beta1"
                  kind = "Record"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = recordName}
                  spec.forProvider = Route53AwsmUpboundIoV1beta1RecordSpecForProvider {
                      zoneId = zoneId
                      name = domainName
                      $type = recordType
                      alias = Route53AwsmUpboundIoV1beta1RecordSpecForProviderAlias {
                          name = distributionDomainName
                          zoneId = staticWebsiteCloudFrontZoneId
                          evaluateTargetHealth = False
                      }
                  }
              }
          }

          composeStaticWebsite = lambda oxr, ocds -> [any] {
              spec: StaticWebsiteSpec = oxr.spec

              _domainName = spec.domainName
              _bucketName = spec.bucketName or _domainName.replace(".", "-")

              # CloudFront only reads certificates from us-east-1, so the certificate is always requested there.
              _certificate = {
                  apiVersion = "platform.demotw.com/v1alpha1"
                  kind = "TlsCertificate"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = staticWebsiteCertificateName}
                  spec = TlsCertificateSpec {
                      domainName = _domainName
                      hostedZoneId = spec.hostedZoneId
                      region = "us-east-1"
                  }
              }

              _bucket = {
                  apiVersion = "s3.aws.m.upbound.io/v1beta1"
                  kind = "Bucket"
                  metadata.annotations = {
                      "crossplane.io/external-name" = _bucketName
                      "krm.kcl.dev/composition-resource-name" = staticWebsiteBucketResourceName
                  }
                  spec.forProvider = S3AwsmUpboundIoV1beta1BucketSpecForProvider {
                      region = spec.bucketRegion
                  }
              }

              _publicAccessBlock = {
                  apiVersion = "s3.aws.m.upbound.io/v1beta1"
                  kind = "BucketPublicAccessBlock"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = staticWebsitePublicAccessBlockName}
                  spec.forProvider = S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProvider {
                      bucket = _bucketName
                      region = spec.bucketRegion
                      blockPublicAcls = True
                      blockPublicPolicy = True
                      ignorePublicAcls = True
                      restrictPublicBuckets = True
                  }
              }

              _originAccessControl = {
                  apiVersion = "cloudfront.aws.m.upbound.io/v1beta1"
                  kind = "OriginAccessControl"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = staticWebsiteOriginAccessControlName}
                  spec.forProvider = CloudfrontAwsmUpboundIoV1beta1OriginAccessControlSpecForProvider {
                      name = _bucketName
                      description = "Read access to ${_domainName} from CloudFront"
                      originAccessControlOriginType = "s3"
                      signingBehavior = "always"
                      signingProtocol = "sigv4"
                  }
              }

              # Observed state. Each value is None until the resource reports it.
              _observedBucket = staticWebsiteBucketObserved(ocds[staticWebsiteBucketResourceName]?.Resource?.status?.atProvider) if ocds[staticWebsiteBucketResourceName]?.Resource?.status?.atProvider else None
              _observedOac = staticWebsiteOacObserved(ocds[staticWebsiteOriginAccessControlName]?.Resource?.status?.atProvider) if ocds[staticWebsiteOriginAccessControlName]?.Resource?.status?.atProvider else None
              _observedDistribution = staticWebsiteDistributionObserved(ocds[staticWebsiteDistributionName]?.Resource?.status?.atProvider) if ocds[staticWebsiteDistributionName]?.Resource?.status?.atProvider else None

              _bucketRegionalDomainName = _observedBucket?.bucketRegionalDomainName
              _oacId = _observedOac?.id

              # The child certificate reports validated only once ACM has issued it.
              _certificateStatus = ocds[staticWebsiteCertificateName]?.Resource?.status
              _certificateArn = _certificateStatus?.certificateArn if _certificateStatus?.validated else None

              _originId = "${_bucketName}-origin"
              _distributionReady = bool(_bucketRegionalDomainName) and bool(_oacId) and bool(_certificateArn)

              _distribution = {
                  apiVersion = "cloudfront.aws.m.upbound.io/v1beta1"
                  kind = "Distribution"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = staticWebsiteDistributionName}
                  spec.forProvider = CloudfrontAwsmUpboundIoV1beta1DistributionSpecForProvider {
                      enabled = True
                      isIpv6Enabled = True
                      comment = _domainName
                      aliases = [_domainName]
                      defaultRootObject = spec.indexDocument
                      priceClass = "PriceClass_100"
                      origin = [CloudfrontAwsmUpboundIoV1beta1DistributionSpecForProviderOriginItems0 {
                          domainName = _bucketRegionalDomainName
                          originId = _originId
                          originAccessControlId = _oacId
                      }]
                      defaultCacheBehavior = CloudfrontAwsmUpboundIoV1beta1DistributionSpecForProviderDefaultCacheBehavior {
                          targetOriginId = _originId
                          viewerProtocolPolicy = "redirect-to-https"
                          allowedMethods = ["GET", "HEAD"]
                          cachedMethods = ["GET", "HEAD"]
                          cachePolicyId = staticWebsiteCachePolicyId
                          compress = True
                      }
                      viewerCertificate = CloudfrontAwsmUpboundIoV1beta1DistributionSpecForProviderViewerCertificate {
                          acmCertificateArn = _certificateArn
                          sslSupportMethod = "sni-only"
                          minimumProtocolVersion = "TLSv1.2_2021"
                      }
                      restrictions = CloudfrontAwsmUpboundIoV1beta1DistributionSpecForProviderRestrictions {
                          geoRestriction = {restrictionType = "none"}
                      }
                  }
              } if _distributionReady else None

              _distributionArn = _observedDistribution?.arn
              _distributionDomainName = _observedDistribution?.domainName
              _distributionZoneId = _observedDistribution?.hostedZoneId

              # The bucket only allows reads from this distribution, not from any CloudFront distribution.
              _bucketPolicy = {
                  apiVersion = "s3.aws.m.upbound.io/v1beta1"
                  kind = "BucketPolicy"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = staticWebsiteBucketPolicyName}
                  spec.forProvider = S3AwsmUpboundIoV1beta1BucketPolicySpecForProvider {
                      bucket = _bucketName
                      region = spec.bucketRegion
                      policy = json.encode({
                          Version = "2012-10-17"
                          Statement = [
                              {
                                  Sid = "AllowCloudFrontRead"
                                  Effect = "Allow"
                                  Principal = {Service = "cloudfront.amazonaws.com"}
                                  Action = ["s3:GetObject"]
                                  Resource = "arn:aws:s3:::${_bucketName}/*"
                                  Condition = {StringEquals = {"AWS:SourceArn" = _distributionArn}}
                              }
                          ]
                      })
                  }
              } if _distributionArn else None

              _aliasRecords = [
                  staticWebsiteAliasRecord(staticWebsiteAliasName, "A", spec.hostedZoneId, _domainName, _distributionDomainName),
                  staticWebsiteAliasRecord(staticWebsiteAliasAaaaName, "AAAA", spec.hostedZoneId, _domainName, _distributionDomainName)
              ] if _distributionDomainName else []

              _xr = {
                  apiVersion = oxr.apiVersion
                  kind = oxr.kind
                  metadata = oxr.metadata
                  status = StaticWebsiteStatus {
                      url = "https://${_domainName}"
                      distributionDomainName = _distributionDomainName
                  }
              } if _distributionDomainName else None

              [_certificate, _bucket, _publicAccessBlock, _originAccessControl] + ([_distribution] if _distribution else []) + ([_bucketPolicy] if _bucketPolicy else []) + _aliasRecords + ([_xr] if _xr else [])
          }

          _kilnSpecFields = ["bucketName", "bucketRegion", "domainName", "hostedZoneId", "indexDocument"]
          _kilnObservedXr = option("params").oxr
          _kilnOxr = _kilnObservedXr | {spec = {k: v for k, v in _kilnObservedXr.spec if k in _kilnSpecFields}} if _kilnObservedXr?.spec else _kilnObservedXr
          _kilnProviderConfigRef = {kind = "ClusterProviderConfig", name = "pod-identity"}
          _kilnIsManaged = lambda r: any -> bool {
              "forProvider" in (r?.spec or {}) and not (r?.apiVersion or "").startswith("platform.example.com/")
          }
          _kilnWithProviderConfig = lambda r: any -> any {
              r | {spec.providerConfigRef = _kilnProviderConfigRef} if _kilnIsManaged(r) and not r?.spec?.providerConfigRef else r
          }
          items = [_kilnWithProviderConfig(r) for r in composeStaticWebsite(_kilnOxr, option("params").ocds)]
  - step: auto-ready
    functionRef:
      name: function-auto-ready
