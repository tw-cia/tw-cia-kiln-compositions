apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: staticwebsite-kcl-first
spec:
  compositeTypeRef:
    apiVersion: platform.demotw.com/v1alpha1
    kind: StaticWebsite
  mode: Pipeline
  pipeline:
  - step: compose
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      spec:
        source: |
          # Curated provider schemas. `kiln import <crd>` appends here.

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderAlias:
              evaluateTargetHealth?: bool
              name?: str
              zoneId?: str

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderCidrRoutingPolicy:
              collectionId?: str
              locationName?: str

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderFailoverRoutingPolicy:
              $type?: str

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderGeolocationRoutingPolicy:
              continent?: str
              country?: str
              subdivision?: str

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderGeoproximityRoutingPolicy:
              awsRegion?: str
              bias?: float
              coordinates?: [Route53AwsmUpboundIoV1beta1RecordSpecForProviderGeoproximityRoutingPolicyCoordinates]
              localZoneGroup?: str

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderHealthCheckIDRef:
              name: str
              namespace?: str
              policy?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderHealthCheckIDRefPolicy

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderHealthCheckIDSelector:
              matchControllerRef?: bool
              matchLabels?: {str:str}
              namespace?: str
              policy?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderHealthCheckIDSelectorPolicy

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderLatencyRoutingPolicy:
              region: str

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderRecordsRefs:
              name: str
              namespace?: str
              policy?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderRecordsRefsPolicy

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderRecordsSelector:
              matchControllerRef?: bool
              matchLabels?: {str:str}
              namespace?: str
              policy?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderRecordsSelectorPolicy

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderWeightedRoutingPolicy:
              weight?: float

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderZoneIDRef:
              name: str
              namespace?: str
              policy?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderZoneIDRefPolicy

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderZoneIDSelector:
              matchControllerRef?: bool
              matchLabels?: {str:str}
              namespace?: str
              policy?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderZoneIDSelectorPolicy

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderGeoproximityRoutingPolicyCoordinates:
              latitude?: str
              longitude?: str

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderHealthCheckIDRefPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderHealthCheckIDSelectorPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderRecordsRefsPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderRecordsSelectorPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProvider:
              alias?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderAlias
              allowOverwrite?: bool
              cidrRoutingPolicy?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderCidrRoutingPolicy
              failoverRoutingPolicy?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderFailoverRoutingPolicy
              geolocationRoutingPolicy?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderGeolocationRoutingPolicy
              geoproximityRoutingPolicy?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderGeoproximityRoutingPolicy
              healthCheckId?: str
              healthCheckIdRef?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderHealthCheckIDRef
              healthCheckIdSelector?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderHealthCheckIDSelector
              latencyRoutingPolicy?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderLatencyRoutingPolicy
              multivalueAnswerRoutingPolicy?: bool
              name?: str
              records?: [str]
              recordsRefs?: [Route53AwsmUpboundIoV1beta1RecordSpecForProviderRecordsRefs]
              recordsSelector?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderRecordsSelector
              setIdentifier?: str
              ttl?: float
              $type?: str
              weightedRoutingPolicy?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderWeightedRoutingPolicy
              zoneId?: str
              zoneIdRef?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderZoneIDRef
              zoneIdSelector?: Route53AwsmUpboundIoV1beta1RecordSpecForProviderZoneIDSelector

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderZoneIDRefPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema Route53AwsmUpboundIoV1beta1RecordSpecForProviderZoneIDSelectorPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema S3AwsmUpboundIoV1beta1BucketAtProviderCorsRule:
              allowedHeaders?: [str]
              allowedMethods?: [str]
              allowedOrigins?: [str]
              exposeHeaders?: [str]
              maxAgeSeconds?: float

          schema S3AwsmUpboundIoV1beta1BucketAtProviderGrant:
              id?: str
              permissions?: [str]
              $type?: str
              uri?: str

          schema S3AwsmUpboundIoV1beta1BucketAtProviderLifecycleRule:
              abortIncompleteMultipartUploadDays?: float
              enabled?: bool
              expiration?: S3AwsmUpboundIoV1beta1BucketSpecForProviderLifecycleRuleExpiration
              id?: str
              noncurrentVersionExpiration?: S3AwsmUpboundIoV1beta1BucketSpecForProviderLifecycleRuleNoncurrentVersionExpiration
              noncurrentVersionTransition?: [S3AwsmUpboundIoV1beta1BucketSpecForProviderLifecycleRuleNoncurrentVersionTransition]
              prefix?: str
              tags?: {str:str}
              transition?: [S3AwsmUpboundIoV1beta1BucketSpecForProviderLifecycleRuleTransition]

          schema S3AwsmUpboundIoV1beta1BucketAtProviderLogging:
              targetBucket?: str
              targetPrefix?: str

          schema S3AwsmUpboundIoV1beta1BucketAtProviderObjectLockConfiguration:
              objectLockEnabled?: str
              $rule?: S3AwsmUpboundIoV1beta1BucketSpecForProviderObjectLockConfigurationRule

          schema S3AwsmUpboundIoV1beta1BucketAtProviderReplicationConfiguration:
              role?: str
              rules?: [S3AwsmUpboundIoV1beta1BucketSpecForProviderReplicationConfigurationRules]

          schema S3AwsmUpboundIoV1beta1BucketAtProviderServerSideEncryptionConfiguration:
              $rule?: S3AwsmUpboundIoV1beta1BucketSpecForProviderServerSideEncryptionConfigurationRule

          schema S3AwsmUpboundIoV1beta1BucketAtProviderVersioning:
              enabled?: bool
              mfaDelete?: bool

          schema S3AwsmUpboundIoV1beta1BucketAtProviderWebsite:
              errorDocument?: str
              indexDocument?: str
              redirectAllRequestsTo?: str
              routingRules?: str

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderDestinationAccessControlTranslation:
              owner?: str

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderDestinationMetrics:
              minutes?: float
              status?: str

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderDestinationReplicationTime:
              minutes?: float
              status?: str

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderLifecycleRuleExpiration:
              date?: str
              days?: float
              expiredObjectDeleteMarker?: bool

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderLifecycleRuleNoncurrentVersionExpiration:
              days?: float

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderLifecycleRuleNoncurrentVersionTransition:
              days?: float
              storageClass?: str

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderLifecycleRuleTransition:
              date?: str
              days?: float
              storageClass?: str

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderObjectLockConfigurationRule:
              defaultRetention?: S3AwsmUpboundIoV1beta1BucketSpecForProviderRuleDefaultRetention

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderReplicationConfigurationRules:
              deleteMarkerReplicationStatus?: str
              destination?: S3AwsmUpboundIoV1beta1BucketSpecForProviderRulesDestination
              $filter?: S3AwsmUpboundIoV1beta1BucketSpecForProviderRulesFilter
              id?: str
              prefix?: str
              priority?: float
              sourceSelectionCriteria?: S3AwsmUpboundIoV1beta1BucketSpecForProviderRulesSourceSelectionCriteria
              status?: str

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderRuleApplyServerSideEncryptionByDefault:
              kmsMasterKeyId?: str
              sseAlgorithm?: str

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderRuleDefaultRetention:
              days?: float
              mode?: str
              years?: float

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderRulesDestination:
              accessControlTranslation?: S3AwsmUpboundIoV1beta1BucketSpecForProviderDestinationAccessControlTranslation
              accountId?: str
              bucket?: str
              metrics?: S3AwsmUpboundIoV1beta1BucketSpecForProviderDestinationMetrics
              replicaKmsKeyId?: str
              replicationTime?: S3AwsmUpboundIoV1beta1BucketSpecForProviderDestinationReplicationTime
              storageClass?: str

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderRulesFilter:
              prefix?: str
              tags?: {str:str}

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderRulesSourceSelectionCriteria:
              sseKmsEncryptedObjects?: S3AwsmUpboundIoV1beta1BucketSpecForProviderSourceSelectionCriteriaSseKmsEncryptedObjects

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderServerSideEncryptionConfigurationRule:
              applyServerSideEncryptionByDefault?: S3AwsmUpboundIoV1beta1BucketSpecForProviderRuleApplyServerSideEncryptionByDefault
              bucketKeyEnabled?: bool

          schema S3AwsmUpboundIoV1beta1BucketSpecForProviderSourceSelectionCriteriaSseKmsEncryptedObjects:
              enabled?: bool

          schema S3AwsmUpboundIoV1beta1BucketSpecForProvider:
              bucketNamespace?: str
              forceDestroy?: bool
              objectLockEnabled?: bool
              region: str
              tags?: {str:str}

          schema S3AwsmUpboundIoV1beta1BucketStatusAtProvider:
              accelerationStatus?: str
              acl?: str
              arn?: str
              bucketDomainName?: str
              bucketNamespace?: str
              bucketRegion?: str
              bucketRegionalDomainName?: str
              corsRule?: [S3AwsmUpboundIoV1beta1BucketAtProviderCorsRule]
              forceDestroy?: bool
              grant?: [S3AwsmUpboundIoV1beta1BucketAtProviderGrant]
              hostedZoneId?: str
              id?: str
              lifecycleRule?: [S3AwsmUpboundIoV1beta1BucketAtProviderLifecycleRule]
              logging?: S3AwsmUpboundIoV1beta1BucketAtProviderLogging
              objectLockConfiguration?: S3AwsmUpboundIoV1beta1BucketAtProviderObjectLockConfiguration
              objectLockEnabled?: bool
              policy?: str
              region?: str
              replicationConfiguration?: S3AwsmUpboundIoV1beta1BucketAtProviderReplicationConfiguration
              requestPayer?: str
              serverSideEncryptionConfiguration?: S3AwsmUpboundIoV1beta1BucketAtProviderServerSideEncryptionConfiguration
              tags?: {str:str}
              tagsAll?: {str:str}
              versioning?: S3AwsmUpboundIoV1beta1BucketAtProviderVersioning
              website?: S3AwsmUpboundIoV1beta1BucketAtProviderWebsite
              websiteDomain?: str
              websiteEndpoint?: str

          schema S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketRefPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketSelectorPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketRef:
              name: str
              namespace?: str
              policy?: S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketRefPolicy

          schema S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketSelector:
              matchControllerRef?: bool
              matchLabels?: {str:str}
              namespace?: str
              policy?: S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketSelectorPolicy

          schema S3AwsmUpboundIoV1beta1BucketPolicySpecForProvider:
              bucket?: str
              bucketRef?: S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketRef
              bucketSelector?: S3AwsmUpboundIoV1beta1BucketPolicySpecForProviderBucketSelector
              policy?: str
              region: str

          schema S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketRefPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketSelectorPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketRef:
              name: str
              namespace?: str
              policy?: S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketRefPolicy

          schema S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketSelector:
              matchControllerRef?: bool
              matchLabels?: {str:str}
              namespace?: str
              policy?: S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketSelectorPolicy

          schema S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProvider:
              blockPublicAcls?: bool
              blockPublicPolicy?: bool
              bucket?: str
              bucketRef?: S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketRef
              bucketSelector?: S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProviderBucketSelector
              ignorePublicAcls?: bool
              region: str
              restrictPublicBuckets?: bool
              skipDestroy?: bool

          schema CloudfrontAwsmUpboundIoV1beta1OriginAccessControlSpecForProvider:
              description?: str
              name?: str
              originAccessControlOriginType?: str
              signingBehavior?: str
              signingProtocol?: str

          schema CloudfrontAwsmUpboundIoV1beta1OriginAccessControlStatusAtProvider:
              arn?: str
              description?: str
              etag?: str
              id?: str
              name?: str
              originAccessControlOriginType?: str
              signingBehavior?: str
              signingProtocol?: str

          schema StaticWebsiteSpec:
              bucketName: str
              region: str = "us-east-1"
              indexDocument: str = "index.html"
              errorDocument?: str
              aliases?: [str]
              certificateArn?: str
              zoneId?: str
              priceClass: str = "PriceClass_100"
              tags?: {str:str}
              [str]: any

          schema StaticWebsiteStatus:
              distributionId?: str
              domainName?: str

          # Narrow Distribution shapes: only the fields the compose function sets or reads.
          # Hand-written, so `kiln import` does not touch them. `kiln render` still checks
          # every field we set against the real CRD.
          schema StaticWebsiteOriginS3Config:
              originAccessIdentity: str

          schema StaticWebsiteOrigin:
              originId: str
              domainName: str
              originAccessControlId: str
              s3OriginConfig: StaticWebsiteOriginS3Config

          schema StaticWebsiteCacheBehavior:
              targetOriginId: str
              viewerProtocolPolicy: str
              allowedMethods: [str]
              cachedMethods: [str]
              cachePolicyId: str
              compress: bool

          schema StaticWebsiteViewerCertificate:
              cloudfrontDefaultCertificate?: bool
              acmCertificateArn?: str
              sslSupportMethod?: str
              minimumProtocolVersion?: str

          schema StaticWebsiteGeoRestriction:
              restrictionType: str

          schema StaticWebsiteRestrictions:
              geoRestriction: StaticWebsiteGeoRestriction

          schema StaticWebsiteCustomErrorResponse:
              errorCode: int
              responseCode: int
              responsePagePath: str
              errorCachingMinTtl: int

          schema StaticWebsiteDistributionSpec:
              enabled: bool
              comment?: str
              priceClass: str
              defaultRootObject: str
              aliases?: [str]
              tags?: {str:str}
              origin: [StaticWebsiteOrigin]
              defaultCacheBehavior: StaticWebsiteCacheBehavior
              restrictions: StaticWebsiteRestrictions
              viewerCertificate: StaticWebsiteViewerCertificate
              customErrorResponse?: [StaticWebsiteCustomErrorResponse]

          # Observed state stays open: a real atProvider has many more fields than we read.
          schema StaticWebsiteDistributionStatus:
              arn?: str
              domainName?: str
              id?: str
              [str]: any

          import json
          _staticWebsiteBucketRes = "bucket"
          _staticWebsitePublicAccessBlockRes = "public-access-block"
          _staticWebsiteOacRes = "origin-access-control"
          _staticWebsiteDistributionRes = "distribution"
          _staticWebsiteBucketPolicyRes = "bucket-policy"

          _staticWebsiteS3OriginId = "s3-origin"
          # AWS managed cache policy "CachingOptimized"
          _staticWebsiteCachePolicyId = "658327ea-f89d-4fab-a63d-7e88639e58f6"

          # Typed reads of observed state. Each is only called when the atProvider exists.
          _staticWebsiteBucketStatus = lambda atProvider -> S3AwsmUpboundIoV1beta1BucketStatusAtProvider {
              _status: S3AwsmUpboundIoV1beta1BucketStatusAtProvider = atProvider
              _status
          }
          _staticWebsiteOacStatus = lambda atProvider -> CloudfrontAwsmUpboundIoV1beta1OriginAccessControlStatusAtProvider {
              _status: CloudfrontAwsmUpboundIoV1beta1OriginAccessControlStatusAtProvider = atProvider
              _status
          }
          _staticWebsiteDistributionStatus = lambda atProvider -> StaticWebsiteDistributionStatus {
              _status: StaticWebsiteDistributionStatus = atProvider
              _status
          }

          _staticWebsiteCustomErrors = lambda errorDocument -> [any] {
              [{errorCode = code, responseCode = 404, responsePagePath = "/${errorDocument}", errorCachingMinTtl = 10} for code in [403, 404]]
          }

          _staticWebsiteDistributionForProvider = lambda specIn, domainName, oacId -> StaticWebsiteDistributionSpec {
              _viewerCertificate = {
                  acmCertificateArn = specIn.certificateArn
                  sslSupportMethod = "sni-only"
                  minimumProtocolVersion = "TLSv1.2_2021"
              } if specIn.certificateArn else {cloudfrontDefaultCertificate = True}
              _forProvider: StaticWebsiteDistributionSpec = {
                  enabled = True
                  comment = specIn.bucketName
                  priceClass = specIn.priceClass
                  defaultRootObject = specIn.indexDocument
                  aliases = specIn.aliases
                  tags = specIn.tags
                  origin = [
                      {
                          originId = _staticWebsiteS3OriginId
                          domainName = domainName
                          originAccessControlId = oacId
                          s3OriginConfig = {originAccessIdentity = ""}
                      }
                  ]
                  defaultCacheBehavior = {
                      targetOriginId = _staticWebsiteS3OriginId
                      viewerProtocolPolicy = "redirect-to-https"
                      allowedMethods = ["GET", "HEAD"]
                      cachedMethods = ["GET", "HEAD"]
                      cachePolicyId = _staticWebsiteCachePolicyId
                      compress = True
                  }
                  restrictions = {geoRestriction = {restrictionType = "none"}}
                  viewerCertificate = _viewerCertificate
                  customErrorResponse = _staticWebsiteCustomErrors(specIn.errorDocument) if specIn.errorDocument else None
              }
              _forProvider
          }

          _staticWebsiteBucketPolicyForProvider = lambda bucketName, bucketRegion, distributionArn -> S3AwsmUpboundIoV1beta1BucketPolicySpecForProvider {
              _forProvider: S3AwsmUpboundIoV1beta1BucketPolicySpecForProvider = {
                  bucket = bucketName
                  region = bucketRegion
                  policy = json.encode({
                      Version = "2012-10-17"
                      Statement = [
                          {
                              Sid = "AllowCloudFrontRead"
                              Effect = "Allow"
                              Principal = {Service = "cloudfront.amazonaws.com"}
                              Action = "s3:GetObject"
                              Resource = "arn:aws:s3:::${bucketName}/*"
                              Condition = {StringEquals = {"AWS:SourceArn" = distributionArn}}
                          }
                      ]
                  })
              }
              _forProvider
          }

          _staticWebsiteCloudFrontZoneId = "Z2FDTNDATAQYW2"

          _staticWebsiteAliasRecordForProvider = lambda zoneId, domain, distributionDomain -> Route53AwsmUpboundIoV1beta1RecordSpecForProvider {
              _forProvider: Route53AwsmUpboundIoV1beta1RecordSpecForProvider = {
                  zoneId = zoneId
                  name = domain
                  $type = "A"
                  alias = {
                      name = distributionDomain
                      zoneId = _staticWebsiteCloudFrontZoneId
                      evaluateTargetHealth = False
                  }
              }
              _forProvider
          }

          composeStaticWebsite = lambda oxr, ocds -> [any] {
              spec: StaticWebsiteSpec = oxr.spec
              _bucketName = spec.bucketName
              _region = spec.region

              _observedBucketAtProvider = ocds[_staticWebsiteBucketRes]?.Resource?.status?.atProvider
              _observedBucket = _staticWebsiteBucketStatus(_observedBucketAtProvider) if _observedBucketAtProvider else None
              _bucketRegionalDomainName = _observedBucket?.bucketRegionalDomainName

              _observedOacAtProvider = ocds[_staticWebsiteOacRes]?.Resource?.status?.atProvider
              _observedOac = _staticWebsiteOacStatus(_observedOacAtProvider) if _observedOacAtProvider else None
              _oacId = _observedOac?.id

              _observedDistributionAtProvider = ocds[_staticWebsiteDistributionRes]?.Resource?.status?.atProvider
              _observedDistribution = _staticWebsiteDistributionStatus(_observedDistributionAtProvider) if _observedDistributionAtProvider else None
              _distributionArn = _observedDistribution?.arn
              _distributionDomainName = _observedDistribution?.domainName
              _distributionId = _observedDistribution?.id

              _bucketForProvider: S3AwsmUpboundIoV1beta1BucketSpecForProvider = {
                  region = _region
                  tags = spec.tags
              }
              _bucket = {
                  apiVersion = "s3.aws.m.upbound.io/v1beta1"
                  kind = "Bucket"
                  metadata.annotations = {
                      "crossplane.io/external-name" = _bucketName
                      "krm.kcl.dev/composition-resource-name" = _staticWebsiteBucketRes
                  }
                  spec.forProvider = _bucketForProvider
              }

              _publicAccessBlockForProvider: S3AwsmUpboundIoV1beta1BucketPublicAccessBlockSpecForProvider = {
                  bucket = _bucketName
                  region = _region
                  blockPublicAcls = True
                  blockPublicPolicy = True
                  ignorePublicAcls = True
                  restrictPublicBuckets = True
              }
              _publicAccessBlock = {
                  apiVersion = "s3.aws.m.upbound.io/v1beta1"
                  kind = "BucketPublicAccessBlock"
                  metadata.annotations = {
                      "krm.kcl.dev/composition-resource-name" = _staticWebsitePublicAccessBlockRes
                  }
                  spec.forProvider = _publicAccessBlockForProvider
              }

              _oacForProvider: CloudfrontAwsmUpboundIoV1beta1OriginAccessControlSpecForProvider = {
                  name = "${_bucketName}-oac"
                  description = "Origin access for the ${_bucketName} static website"
                  originAccessControlOriginType = "s3"
                  signingBehavior = "always"
                  signingProtocol = "sigv4"
              }
              _oac = {
                  apiVersion = "cloudfront.aws.m.upbound.io/v1beta1"
                  kind = "OriginAccessControl"
                  metadata.annotations = {
                      "krm.kcl.dev/composition-resource-name" = _staticWebsiteOacRes
                  }
                  spec.forProvider = _oacForProvider
              }

              _distributionForProvider = _staticWebsiteDistributionForProvider(spec, _bucketRegionalDomainName, _oacId) if _bucketRegionalDomainName and _oacId else None
              _distribution = {
                  apiVersion = "cloudfront.aws.m.upbound.io/v1beta1"
                  kind = "Distribution"
                  metadata.annotations = {
                      "krm.kcl.dev/composition-resource-name" = _staticWebsiteDistributionRes
                  }
                  spec.forProvider = _distributionForProvider
              } if _distributionForProvider else None

              _bucketPolicy = {
                  apiVersion = "s3.aws.m.upbound.io/v1beta1"
                  kind = "BucketPolicy"
                  metadata.annotations = {
                      "krm.kcl.dev/composition-resource-name" = _staticWebsiteBucketPolicyRes
                  }
                  spec.forProvider = _staticWebsiteBucketPolicyForProvider(_bucketName, _region, _distributionArn)
              } if _distributionArn else None

              _xr = {
                  apiVersion = oxr.apiVersion
                  kind = oxr.kind
                  metadata = oxr.metadata
                  status = StaticWebsiteStatus {
                      distributionId = _distributionId
                      domainName = _distributionDomainName
                  }
              } if _distributionDomainName else None

              _aliasRecords = [{
                  apiVersion = "route53.aws.m.upbound.io/v1beta1"
                  kind = "Record"
                  metadata.annotations = {
                      "krm.kcl.dev/composition-resource-name" = "alias-record-${i}"
                  }
                  spec.forProvider = _staticWebsiteAliasRecordForProvider(spec.zoneId, domain, _distributionDomainName)
              } for i, domain in (spec.aliases or [])] if spec.zoneId and _distributionDomainName else []

              [_bucket, _publicAccessBlock, _oac] + ([_distribution] if _distribution else []) + ([_bucketPolicy] if _bucketPolicy else []) + _aliasRecords + ([_xr] if _xr else [])
          }

          _kilnSpecFields = ["aliases", "bucketName", "certificateArn", "errorDocument", "indexDocument", "priceClass", "region", "tags", "zoneId"]
          _kilnObservedXr = option("params").oxr
          _kilnOxr = _kilnObservedXr | {spec = {k: v for k, v in _kilnObservedXr.spec if k in _kilnSpecFields}} if _kilnObservedXr?.spec else _kilnObservedXr
          _kilnProviderConfigRef = {kind = "ClusterProviderConfig", name = "pod-identity"}
          _kilnIsManaged = lambda r: any -> bool {
              "forProvider" in (r?.spec or {}) and not (r?.apiVersion or "").startswith("platform.demotw.com/")
          }
          _kilnWithProviderConfig = lambda r: any -> any {
              r | {spec.providerConfigRef = _kilnProviderConfigRef} if _kilnIsManaged(r) and not r?.spec?.providerConfigRef else r
          }
          items = [_kilnWithProviderConfig(r) for r in composeStaticWebsite(_kilnOxr, option("params").ocds)]
  - step: auto-ready
    functionRef:
      name: function-auto-ready
