apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: staticwebsites.platform.demotw.com
spec:
  group: platform.demotw.com
  names:
    kind: StaticWebsite
    plural: staticwebsites
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            description: 'Consumer-facing spec for a StaticWebsite composite resource:
              a private S3 bucket served over HTTPS on a custom domain through CloudFront,
              with an ACM certificate issued for that domain.'
            properties:
              bucketName:
                type: string
              domainName:
                type: string
              region:
                type: string
              tags:
                additionalProperties:
                  type: string
                type: object
              zoneId:
                type: string
            required:
            - bucketName
            - domainName
            - region
            - zoneId
            type: object
          status:
            description: Reported once the CloudFront distribution exists.
            properties:
              cloudFrontDomainName:
                type: string
            type: object
