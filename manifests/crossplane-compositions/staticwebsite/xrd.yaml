apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: staticwebsites.platform.demotw.com
spec:
  group: platform.demotw.com
  names:
    kind: StaticWebsite
    plural: staticwebsites
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            description: 'A static website: a private S3 bucket served to the internet
              through CloudFront.'
            properties:
              aliases:
                items:
                  type: string
                type: array
              bucketName:
                type: string
              certificateArn:
                type: string
              errorDocument:
                type: string
              indexDocument:
                default: index.html
                type: string
              priceClass:
                default: PriceClass_100
                type: string
              region:
                default: us-east-1
                type: string
              tags:
                additionalProperties:
                  type: string
                type: object
              zoneId:
                type: string
            required:
            - bucketName
            type: object
          status:
            description: What a consumer needs to reach the site.
            properties:
              distributionId:
                type: string
              domainName:
                type: string
            type: object
