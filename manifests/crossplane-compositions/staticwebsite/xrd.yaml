apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: staticwebsites.platform.demotw.com
spec:
  group: platform.demotw.com
  names:
    kind: StaticWebSite
    plural: staticwebsites
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            properties:
              bucket:
                properties:
                  name:
                    type: string
                  region:
                    default: us-east-1
                    type: string
                required:
                - name
                type: object
              domain:
                properties:
                  hostedZoneId:
                    type: string
                  name:
                    type: string
                required:
                - name
                - hostedZoneId
                type: object
            required:
            - domain
            - bucket
            type: object
          status:
            properties:
              distribution:
                properties:
                  arn:
                    type: string
                  domainName:
                    type: string
                type: object
            type: object
