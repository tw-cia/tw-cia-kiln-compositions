apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: staticwebsites.platform.example.com
spec:
  group: platform.example.com
  names:
    kind: StaticWebSite
    plural: staticwebsites
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            properties:
              bucketName:
                type: string
              domainName:
                type: string
              hostedZoneId:
                type: string
              region:
                default: us-east-1
                type: string
            required:
            - domainName
            - hostedZoneId
            - bucketName
            type: object
          status:
            properties:
              distributionDomainName:
                type: string
            type: object
