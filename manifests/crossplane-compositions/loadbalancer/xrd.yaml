apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: loadbalancers.platform.example.com
spec:
  group: platform.example.com
  names:
    kind: LoadBalancer
    plural: loadbalancers
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            properties:
              autoScalingGroupName:
                type: string
              certificateArn:
                type: string
              region:
                default: us-east-1
                type: string
              securityGroupIds:
                items:
                  type: string
                type: array
              subnetIds:
                items:
                  type: string
                type: array
              targetPort:
                default: 80
                format: int64
                type: integer
              vpcId:
                type: string
            required:
            - vpcId
            - subnetIds
            - securityGroupIds
            - certificateArn
            type: object
          status:
            properties:
              dnsName:
                type: string
              loadBalancerArn:
                type: string
              zoneId:
                type: string
            type: object
