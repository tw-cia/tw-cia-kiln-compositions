          # Your composite resource (XR) spec schemas, one per kind, e.g. `schema MyKindSpec:`.

          # A DNS-validated ACM certificate. CloudFront only accepts certificates from us-east-1,
          # which is the default.

          # A static website served by CloudFront from a private S3 bucket, behind a custom domain.

          # An auto-scaling group of identical instances, built from a launch template.
          schema AutoScalingGroupSpec:
              region: str = "us-east-1"
              imageId: str
              instanceType: str = "t3.micro"
              subnetIds: [str]
              securityGroupIds?: [str]
              minSize: int = 1
              maxSize: int = 3
              desiredCapacity?: int
              # A plain-text boot script, run by each instance on launch. The function encodes it for AWS.
              userData?: str
              check:
                  minSize <= maxSize, "minSize must not be greater than maxSize"
                  desiredCapacity == Undefined or (desiredCapacity >= minSize and desiredCapacity <= maxSize), "desiredCapacity must be between minSize and maxSize"
                  userData == Undefined or len(userData) <= 16384, "userData must be at most 16 KB"

          # An application load balancer serving HTTPS with an existing DNS-validated certificate.
          schema LoadBalancerSpec:
              region: str = "us-east-1"
              vpcId: str
              subnetIds: [str]
              securityGroupIds: [str]
              # The ARN of a validated certificate, for example TlsCertificate status.certificateArn.
              certificateArn: str
              targetPort: int = 80
              # The name of an AutoScalingGroup XR whose instances join the target group.
              autoScalingGroupName?: str
              check:
                  len(subnetIds) >= 2, "an application load balancer needs at least two subnets"

          schema LoadBalancerStatus:
              dnsName?: str
              loadBalancerArn?: str
              # The load balancer's Route53 hosted zone, needed for an alias record.
              zoneId?: str

          # A complete web service: a DNS-validated certificate, an auto-scaling group, a load balancer
          # serving HTTPS with that certificate, and a DNS alias from the domain to the load balancer.
          # Everything about a web service except its name: where it runs and what it serves.
          # WebServiceSpec adds the name, and CdnWebServiceSpec nests one of these as its origin.
          schema WebServiceSettings:
              region: str = "us-east-1"
              vpcId: str
              # The load balancer is internet-facing, so it takes public subnets.
              loadBalancerSubnetIds: [str]
              loadBalancerSecurityGroupIds: [str]
              # The instances take private subnets with a route out, so they can install software at boot.
              instanceSubnetIds: [str]
              instanceSecurityGroupIds: [str]
              imageId: str
              instanceType: str = "t3.micro"
              minSize: int = 1
              maxSize: int = 3
              desiredCapacity?: int
              targetPort: int = 80
              # A plain-text boot script for each instance. See AutoScalingGroupSpec.
              userData?: str
              check:
                  len(loadBalancerSubnetIds) >= 2, "the load balancer needs at least two subnets"
                  minSize <= maxSize, "minSize must not be greater than maxSize"
                  desiredCapacity == Undefined or (desiredCapacity >= minSize and desiredCapacity <= maxSize), "desiredCapacity must be between minSize and maxSize"
                  userData == Undefined or len(userData) <= 16384, "userData must be at most 16 KB"

          schema WebServiceSpec(WebServiceSettings):
              domainName: str
              hostedZoneId: str

          # A web service served through CloudFront. The public name is a CloudFront alias with a us-east-1
          # certificate. CloudFront reaches the origin, a WebService at originDomainName, over HTTPS.
          schema CdnWebServiceSpec:
              domainName: str
              hostedZoneId: str
              originDomainName: str
              origin: WebServiceSettings
              check:
                  domainName != originDomainName, "the public name and the origin name must differ"

          loadBalancerLoadBalancerName = "load-balancer"
          loadBalancerTargetGroupName = "target-group"
          loadBalancerListenerName = "https-listener"
          loadBalancerAttachmentName = "asg-attachment"

          # AWS's predefined TLS 1.3 policy, which still accepts TLS 1.2 for older clients.
          loadBalancerSslPolicy = "ELBSecurityPolicy-TLS13-1-2-2021-06"

          # Reads observed resources through their imported status schemas, so a misspelt field is a compile error.
          loadBalancerObservedLoadBalancer = lambda atProvider -> Elbv2AwsmUpboundIoV1beta1LBStatusAtProvider {
              _status: Elbv2AwsmUpboundIoV1beta1LBStatusAtProvider = atProvider
              _status
          }

          loadBalancerObservedTargetGroup = lambda atProvider -> Elbv2AwsmUpboundIoV1beta1LBTargetGroupStatusAtProvider {
              _status: Elbv2AwsmUpboundIoV1beta1LBTargetGroupStatusAtProvider = atProvider
              _status
          }

          composeLoadBalancer = lambda oxr, ocds -> [any] {
              spec: LoadBalancerSpec = oxr.spec

              # The load balancer and its target group take the XR's name, so the cloud objects are easy to find.
              _name = oxr.metadata.name

              _loadBalancer = {
                  apiVersion = "elbv2.aws.m.upbound.io/v1beta1"
                  kind = "LB"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = loadBalancerLoadBalancerName}
                  spec.forProvider = Elbv2AwsmUpboundIoV1beta1LBSpecForProvider {
                      region = spec.region
                      # Named here, not by external name: the provider reads an external name as the load balancer's ARN.
                      name = _name
                      loadBalancerType = "application"
                      internal = False
                      ipAddressType = "ipv4"
                      subnets = spec.subnetIds
                      securityGroups = spec.securityGroupIds
                  }
              }

              _targetGroup = {
                  apiVersion = "elbv2.aws.m.upbound.io/v1beta1"
                  kind = "LBTargetGroup"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = loadBalancerTargetGroupName}
                  spec.forProvider = Elbv2AwsmUpboundIoV1beta1LBTargetGroupSpecForProvider {
                      region = spec.region
                      name = _name
                      port = spec.targetPort
                      $protocol = "HTTP"
                      vpcId = spec.vpcId
                      targetType = "instance"
                  }
              }

              _observedLoadBalancerAtProvider = ocds[loadBalancerLoadBalancerName]?.Resource?.status?.atProvider
              _observedLoadBalancer = loadBalancerObservedLoadBalancer(_observedLoadBalancerAtProvider) if _observedLoadBalancerAtProvider else None
              _loadBalancerArn = _observedLoadBalancer?.arn
              _dnsName = _observedLoadBalancer?.dnsName
              _zoneId = _observedLoadBalancer?.zoneId

              _observedTargetGroupAtProvider = ocds[loadBalancerTargetGroupName]?.Resource?.status?.atProvider
              _observedTargetGroup = loadBalancerObservedTargetGroup(_observedTargetGroupAtProvider) if _observedTargetGroupAtProvider else None
              _targetGroupArn = _observedTargetGroup?.arn

              # The HTTPS listener serves the existing validated certificate, so no new certificate is requested.
              _listener = {
                  apiVersion = "elbv2.aws.m.upbound.io/v1beta1"
                  kind = "LBListener"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = loadBalancerListenerName}
                  spec.forProvider = Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProvider {
                      region = spec.region
                      loadBalancerArn = _loadBalancerArn
                      port = 443
                      $protocol = "HTTPS"
                      certificateArn = spec.certificateArn
                      sslPolicy = loadBalancerSslPolicy
                      defaultAction = [Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultActionItems0 {
                          $type = "forward"
                          targetGroupArn = _targetGroupArn
                      }]
                  }
              } if _loadBalancerArn and _targetGroupArn else None

              # Instances join the target group only when the consumer names their auto-scaling group.
              _attachment = {
                  apiVersion = "autoscaling.aws.m.upbound.io/v1beta1"
                  kind = "Attachment"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = loadBalancerAttachmentName}
                  spec.forProvider = AutoscalingAwsmUpboundIoV1beta1AttachmentSpecForProvider {
                      region = spec.region
                      autoscalingGroupName = spec.autoScalingGroupName
                      lbTargetGroupArn = _targetGroupArn
                  }
              } if _targetGroupArn and spec.autoScalingGroupName else None

              _xr = {
                  apiVersion = oxr.apiVersion
                  kind = oxr.kind
                  metadata = oxr.metadata
                  status = LoadBalancerStatus {
                      dnsName = _dnsName
                      loadBalancerArn = _loadBalancerArn
                      zoneId = _zoneId
                  }
              } if _dnsName else None

              [_loadBalancer, _targetGroup] + ([_listener] if _listener else []) + ([_attachment] if _attachment else []) + ([_xr] if _xr else [])
          }

          _kilnSpecFields = ["autoScalingGroupName", "certificateArn", "region", "securityGroupIds", "subnetIds", "targetPort", "vpcId"]
          _kilnObservedXr = option("params").oxr
          _kilnOxr = _kilnObservedXr | {spec = {k: v for k, v in _kilnObservedXr.spec if k in _kilnSpecFields}} if _kilnObservedXr?.spec else _kilnObservedXr
          _kilnProviderConfigRef = {kind = "ClusterProviderConfig", name = "pod-identity"}
          _kilnIsManaged = lambda r: any -> bool {
              "forProvider" in (r?.spec or {}) and not (r?.apiVersion or "").startswith("platform.example.com/")
          }
          _kilnWithProviderConfig = lambda r: any -> any {
              r | {spec.providerConfigRef = _kilnProviderConfigRef} if _kilnIsManaged(r) and not r?.spec?.providerConfigRef else r
          }
          items = [_kilnWithProviderConfig(r) for r in composeLoadBalancer(_kilnOxr, option("params").ocds)]
  - step: auto-ready
    functionRef:
      name: function-auto-ready
