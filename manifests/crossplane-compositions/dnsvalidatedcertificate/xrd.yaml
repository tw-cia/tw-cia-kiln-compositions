apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: dnsvalidatedcertificates.platform.demotw.com
spec:
  group: platform.demotw.com
  names:
    kind: DnsValidatedCertificate
    plural: dnsvalidatedcertificates
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            description: 'Consumer-facing spec for a DnsValidatedCertificate composite
              resource: an ACM certificate validated by DNS records in an existing
              Route53 zone.'
            properties:
              domainName:
                type: string
              region:
                type: string
              subjectAlternativeNames:
                items:
                  type: string
                type: array
              tags:
                additionalProperties:
                  type: string
                type: object
              zoneId:
                type: string
            required:
            - domainName
            - region
            - zoneId
            type: object
          status:
            description: Reported only once ACM has validated the certificate.
            properties:
              certificateArn:
                type: string
            type: object
