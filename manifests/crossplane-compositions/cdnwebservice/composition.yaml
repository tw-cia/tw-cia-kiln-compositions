              viewerMtlsConfig?: CloudfrontAwsmUpboundIoV1beta1DistributionAtProviderViewerMtlsConfig
              waitForDeployment?: bool
              webAclId?: str

          schema CloudfrontAwsmUpboundIoV1beta1DistributionStatusAtProviderTrustedKeyGroups:
              keyGroupId?: str
              keyPairIds?: [str]

          schema CloudfrontAwsmUpboundIoV1beta1DistributionStatusAtProviderTrustedSigners:
              awsAccountNumber?: str
              keyPairIds?: [str]

          schema CloudfrontAwsmUpboundIoV1beta1DistributionSpecForProviderViewerMtlsConfigTrustStoreConfig:
              advertiseTrustStoreCaNames?: bool
              ignoreCertificateExpiry?: bool
              trustStoreId?: str

          # Your composite resource (XR) spec schemas, one per kind, e.g. `schema MyKindSpec:`.

          # A DNS-validated ACM certificate. CloudFront only accepts certificates from us-east-1,
          # which is the default.
          schema TlsCertificateSpec:
              domainName: str
              hostedZoneId: str
              subjectAlternativeNames?: [str]
              region: str = "us-east-1"

          # A static website served by CloudFront from a private S3 bucket, behind a custom domain.

          # An auto-scaling group of identical instances, built from a launch template.
          schema AutoScalingGroupSpec:
              region: str = "us-east-1"
              imageId: str
              instanceType: str = "t3.micro"
              subnetIds: [str]
              securityGroupIds?: [str]
              minSize: int = 1
              maxSize: int = 3
              desiredCapacity?: int
              # A plain-text boot script, run by each instance on launch. The function encodes it for AWS.
              userData?: str
              check:
                  minSize <= maxSize, "minSize must not be greater than maxSize"
                  desiredCapacity == Undefined or (desiredCapacity >= minSize and desiredCapacity <= maxSize), "desiredCapacity must be between minSize and maxSize"
                  userData == Undefined or len(userData) <= 16384, "userData must be at most 16 KB"

          # An application load balancer serving HTTPS with an existing DNS-validated certificate.

          # A complete web service: a DNS-validated certificate, an auto-scaling group, a load balancer
          # serving HTTPS with that certificate, and a DNS alias from the domain to the load balancer.
          # Everything about a web service except its name: where it runs and what it serves.
          # WebServiceSpec adds the name, and CdnWebServiceSpec nests one of these as its origin.
          schema WebServiceSettings:
              region: str = "us-east-1"
              vpcId: str
              # The load balancer is internet-facing, so it takes public subnets.
              loadBalancerSubnetIds: [str]
              loadBalancerSecurityGroupIds: [str]
              # The instances take private subnets with a route out, so they can install software at boot.
              instanceSubnetIds: [str]
              instanceSecurityGroupIds: [str]
              imageId: str
              instanceType: str = "t3.micro"
              minSize: int = 1
              maxSize: int = 3
              desiredCapacity?: int
              targetPort: int = 80
              # A plain-text boot script for each instance. See AutoScalingGroupSpec.
              userData?: str
              check:
                  len(loadBalancerSubnetIds) >= 2, "the load balancer needs at least two subnets"
                  minSize <= maxSize, "minSize must not be greater than maxSize"
                  desiredCapacity == Undefined or (desiredCapacity >= minSize and desiredCapacity <= maxSize), "desiredCapacity must be between minSize and maxSize"
                  userData == Undefined or len(userData) <= 16384, "userData must be at most 16 KB"

          schema WebServiceSpec(WebServiceSettings):
              domainName: str
              hostedZoneId: str

          # A web service served through CloudFront. The public name is a CloudFront alias with a us-east-1
          # certificate. CloudFront reaches the origin, a WebService at originDomainName, over HTTPS.
          schema CdnWebServiceSpec:
              domainName: str
              hostedZoneId: str
              originDomainName: str
              origin: WebServiceSettings
              check:
                  domainName != originDomainName, "the public name and the origin name must differ"

          schema CdnWebServiceStatus:
              url?: str
              distributionDomainName?: str

          cdnWebServiceOriginName = "origin"
          cdnWebServiceViewerCertificateName = "viewer-certificate"
          cdnWebServiceDistributionName = "distribution"
          cdnWebServiceAliasName = "viewer-alias"
          cdnWebServiceAliasAaaaName = "viewer-alias-aaaa"

          # CloudFront's own hosted zone, the target of alias records.
          cdnWebServiceCloudFrontZoneId = "Z2FDTNDATAQYW2"
          # AWS managed "CachingDisabled": a web service's responses are not cached by default.
          cdnWebServiceCachePolicyId = "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
          # AWS managed "AllViewerExceptHostHeader": forwards the viewer's request except the Host header.
          cdnWebServiceOriginRequestPolicyId = "b689b0a8-53d0-40ab-baf2-68738e2966ac"

          # Reads the observed distribution through its imported schema, so a misspelt field is a compile error.
          cdnWebServiceDistributionObserved = lambda atProvider -> CloudfrontAwsmUpboundIoV1beta1DistributionStatusAtProvider {
              _status: CloudfrontAwsmUpboundIoV1beta1DistributionStatusAtProvider = atProvider
              _status
          }

          # One alias record (A or AAAA) for the public name, pointing at the distribution.
          cdnWebServiceAliasRecord = lambda recordName, recordType, zoneId, domainName, distributionDomainName -> any {
              {
                  apiVersion = "route53.aws.m.upbound.io/v1beta1"
                  kind = "Record"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = recordName}
                  spec.forProvider = Route53AwsmUpboundIoV1beta1RecordSpecForProvider {
                      zoneId = zoneId
                      name = domainName
                      $type = recordType
                      alias = Route53AwsmUpboundIoV1beta1RecordSpecForProviderAlias {
                          name = distributionDomainName
                          zoneId = cdnWebServiceCloudFrontZoneId
                          evaluateTargetHealth = False
                      }
                  }
              }
          }

          composeCdnWebService = lambda oxr, ocds -> [any] {
              _cdnSpec: CdnWebServiceSpec = oxr.spec

              _name = oxr.metadata.name

              # The origin is a web service of its own, named after the XR. Its settings come from the nested origin block.
              _origin = {
                  apiVersion = "platform.demotw.com/v1alpha1"
                  kind = "WebService"
                  metadata = {
                      name = "${_name}-origin"
                      annotations = {"krm.kcl.dev/composition-resource-name" = cdnWebServiceOriginName}
                  }
                  spec = WebServiceSpec {
                      **_cdnSpec.origin
                      domainName = _cdnSpec.originDomainName
                      hostedZoneId = _cdnSpec.hostedZoneId
                  }
              }

              # CloudFront reads viewer certificates only from us-east-1, so this one is always requested there.
              _viewerCertificate = {
                  apiVersion = "platform.demotw.com/v1alpha1"
                  kind = "TlsCertificate"
                  metadata = {
                      name = "${_name}-viewer-certificate"
                      annotations = {"krm.kcl.dev/composition-resource-name" = cdnWebServiceViewerCertificateName}
                  }
                  spec = TlsCertificateSpec {
                      domainName = _cdnSpec.domainName
                      hostedZoneId = _cdnSpec.hostedZoneId
                      region = "us-east-1"
                  }
              }

              _viewerCertificateStatus = ocds[cdnWebServiceViewerCertificateName]?.Resource?.status
              _viewerCertificateArn = _viewerCertificateStatus?.certificateArn if _viewerCertificateStatus?.validated else None

              # The origin's name must resolve before CloudFront can reach it, so the distribution waits for the load balancer's DNS name.
              _originStatus = ocds[cdnWebServiceOriginName]?.Resource?.status
              _originDnsName = _originStatus?.loadBalancerDnsName

              _originId = "${_cdnSpec.originDomainName}-origin"

              _distribution = {
                  apiVersion = "cloudfront.aws.m.upbound.io/v1beta1"
                  kind = "Distribution"
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = cdnWebServiceDistributionName}
                  spec.forProvider = CloudfrontAwsmUpboundIoV1beta1DistributionSpecForProvider {
                      enabled = True
                      isIpv6Enabled = True
                      comment = _cdnSpec.domainName
                      aliases = [_cdnSpec.domainName]
                      priceClass = "PriceClass_100"
                      origin = [CloudfrontAwsmUpboundIoV1beta1DistributionSpecForProviderOriginItems0 {
                          domainName = _cdnSpec.originDomainName
                          originId = _originId
                          customOriginConfig = CloudfrontAwsmUpboundIoV1beta1DistributionSpecForProviderOriginItems0CustomOriginConfig {
                              httpPort = 80
                              httpsPort = 443
                              originProtocolPolicy = "https-only"
                              originSslProtocols = ["TLSv1.2"]
                          }
                      }]
                      defaultCacheBehavior = CloudfrontAwsmUpboundIoV1beta1DistributionSpecForProviderDefaultCacheBehavior {
                          targetOriginId = _originId
                          viewerProtocolPolicy = "redirect-to-https"
                          allowedMethods = ["GET", "HEAD", "OPTIONS", "PUT", "POST", "PATCH", "DELETE"]
                          cachedMethods = ["GET", "HEAD"]
                          cachePolicyId = cdnWebServiceCachePolicyId
                          originRequestPolicyId = cdnWebServiceOriginRequestPolicyId
                          compress = True
                      }
                      viewerCertificate = CloudfrontAwsmUpboundIoV1beta1DistributionSpecForProviderViewerCertificate {
                          acmCertificateArn = _viewerCertificateArn
                          sslSupportMethod = "sni-only"
                          minimumProtocolVersion = "TLSv1.2_2021"
                      }
                      restrictions = CloudfrontAwsmUpboundIoV1beta1DistributionSpecForProviderRestrictions {
                          geoRestriction = {restrictionType = "none"}
                      }
                  }
              } if _viewerCertificateArn and _originDnsName else None

              _observedDistributionAtProvider = ocds[cdnWebServiceDistributionName]?.Resource?.status?.atProvider
              _observedDistribution = cdnWebServiceDistributionObserved(_observedDistributionAtProvider) if _observedDistributionAtProvider else None
              _distributionDomainName = _observedDistribution?.domainName
              _distributionZoneId = _observedDistribution?.hostedZoneId

              _aliasRecords = [
                  cdnWebServiceAliasRecord(cdnWebServiceAliasName, "A", _cdnSpec.hostedZoneId, _cdnSpec.domainName, _distributionDomainName),
                  cdnWebServiceAliasRecord(cdnWebServiceAliasAaaaName, "AAAA", _cdnSpec.hostedZoneId, _cdnSpec.domainName, _distributionDomainName)
              ] if _distributionDomainName else []

              _xr = {
                  apiVersion = oxr.apiVersion
                  kind = oxr.kind
                  metadata = oxr.metadata
                  status = CdnWebServiceStatus {
                      url = "https://${_cdnSpec.domainName}"
                      distributionDomainName = _distributionDomainName
                  }
              } if _distributionDomainName else None

              [_origin, _viewerCertificate] + ([_distribution] if _distribution else []) + _aliasRecords + ([_xr] if _xr else [])
          }

          _kilnSpecFields = ["domainName", "hostedZoneId", "origin", "originDomainName"]
          _kilnObservedXr = option("params").oxr
          _kilnOxr = _kilnObservedXr | {spec = {k: v for k, v in _kilnObservedXr.spec if k in _kilnSpecFields}} if _kilnObservedXr?.spec else _kilnObservedXr
          _kilnProviderConfigRef = {kind = "ClusterProviderConfig", name = "pod-identity"}
          _kilnIsManaged = lambda r: any -> bool {
              "forProvider" in (r?.spec or {}) and not (r?.apiVersion or "").startswith("platform.example.com/")
          }
          _kilnWithProviderConfig = lambda r: any -> any {
              r | {spec.providerConfigRef = _kilnProviderConfigRef} if _kilnIsManaged(r) and not r?.spec?.providerConfigRef else r
          }
          items = [_kilnWithProviderConfig(r) for r in composeCdnWebService(_kilnOxr, option("params").ocds)]
  - step: auto-ready
    functionRef:
      name: function-auto-ready
