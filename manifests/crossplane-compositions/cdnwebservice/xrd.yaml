apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: cdnwebservices.platform.example.com
spec:
  group: platform.example.com
  names:
    kind: CdnWebService
    plural: cdnwebservices
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            properties:
              domainName:
                type: string
              hostedZoneId:
                type: string
              origin:
                properties:
                  desiredCapacity:
                    format: int64
                    type: integer
                  imageId:
                    type: string
                  instanceSecurityGroupIds:
                    items:
                      type: string
                    type: array
                  instanceSubnetIds:
                    items:
                      type: string
                    type: array
                  instanceType:
                    default: t3.micro
                    type: string
                  loadBalancerSecurityGroupIds:
                    items:
                      type: string
                    type: array
                  loadBalancerSubnetIds:
                    items:
                      type: string
                    type: array
                  maxSize:
                    default: 3
                    format: int64
                    type: integer
                  minSize:
                    default: 1
                    format: int64
                    type: integer
                  region:
                    default: us-east-1
                    type: string
                  targetPort:
                    default: 80
                    format: int64
                    type: integer
                  userData:
                    type: string
                  vpcId:
                    type: string
                required:
                - vpcId
                - loadBalancerSubnetIds
                - loadBalancerSecurityGroupIds
                - instanceSubnetIds
                - instanceSecurityGroupIds
                - imageId
                type: object
              originDomainName:
                type: string
            required:
            - domainName
            - hostedZoneId
            - originDomainName
            - origin
            type: object
          status:
            properties:
              distributionDomainName:
                type: string
              url:
                type: string
            type: object
