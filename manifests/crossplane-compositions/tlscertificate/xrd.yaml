apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: tlscertificates.platform.demotw.com
spec:
  group: platform.demotw.com
  names:
    kind: TlsCertificate
    plural: tlscertificates
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            properties:
              domainName:
                type: string
              hostedZoneId:
                type: string
              region:
                default: us-east-1
                type: string
            required:
            - domainName
            - hostedZoneId
            type: object
          status:
            properties:
              certificateArn:
                type: string
              validated:
                type: boolean
            type: object
