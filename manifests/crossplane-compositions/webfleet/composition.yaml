              statusCode?: str

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultActionForward:
              stickiness?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderForwardStickiness
              targetGroup?: [Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderForwardTargetGroup]

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultActionJwtValidation:
              additionalClaim?: [Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderJwtValidationAdditionalClaim]
              issuer?: str
              jwksEndpoint?: str

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultActionRedirect:
              host?: str
              path?: str
              port?: str
              $protocol?: str
              query?: str
              statusCode?: str

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultActionTargetGroupArnRef:
              name: str
              namespace?: str
              policy?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderTargetGroupArnRefPolicy

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultActionTargetGroupArnSelector:
              matchControllerRef?: bool
              matchLabels?: {str:str}
              namespace?: str
              policy?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderTargetGroupArnSelectorPolicy

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultAction:
              authenticateCognito?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultActionAuthenticateCognito
              authenticateOidc?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultActionAuthenticateOidc
              fixedResponse?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultActionFixedResponse
              forward?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultActionForward
              index?: str = "default"
              jwtValidation?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultActionJwtValidation
              order?: float
              redirect?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultActionRedirect
              targetGroupArn?: str
              targetGroupArnRef?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultActionTargetGroupArnRef
              targetGroupArnSelector?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultActionTargetGroupArnSelector
              $type?: str

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderLoadBalancerArnRef:
              name: str
              namespace?: str
              policy?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderLoadBalancerArnRefPolicy

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderLoadBalancerArnSelector:
              matchControllerRef?: bool
              matchLabels?: {str:str}
              namespace?: str
              policy?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderLoadBalancerArnSelectorPolicy

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderMutualAuthentication:
              advertiseTrustStoreCaNames?: str
              ignoreClientCertificateExpiry?: bool
              mode?: str
              trustStoreArn?: str

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderForwardStickiness:
              duration?: float
              enabled?: bool

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderForwardTargetGroup:
              arn?: str
              arnRef?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderTargetGroupArnRef
              arnSelector?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderTargetGroupArnSelector
              weight?: float

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderJwtValidationAdditionalClaim:
              format?: str
              name?: str
              values?: [str]

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderLoadBalancerArnRefPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderLoadBalancerArnSelectorPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProvider:
              alpnPolicy?: str
              certificateArn?: str
              defaultAction?: [Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultAction]
              loadBalancerArn?: str
              loadBalancerArnRef?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderLoadBalancerArnRef
              loadBalancerArnSelector?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderLoadBalancerArnSelector
              mutualAuthentication?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderMutualAuthentication
              port?: float
              $protocol?: str
              region: str
              routingHttpRequestXAmznMtlsClientcertHeaderName?: str
              routingHttpRequestXAmznMtlsClientcertIssuerHeaderName?: str
              routingHttpRequestXAmznMtlsClientcertLeafHeaderName?: str
              routingHttpRequestXAmznMtlsClientcertSerialNumberHeaderName?: str
              routingHttpRequestXAmznMtlsClientcertSubjectHeaderName?: str
              routingHttpRequestXAmznMtlsClientcertValidityHeaderName?: str
              routingHttpRequestXAmznTlsCipherSuiteHeaderName?: str
              routingHttpRequestXAmznTlsVersionHeaderName?: str
              routingHttpResponseAccessControlAllowCredentialsHeaderValue?: str
              routingHttpResponseAccessControlAllowHeadersHeaderValue?: str
              routingHttpResponseAccessControlAllowMethodsHeaderValue?: str
              routingHttpResponseAccessControlAllowOriginHeaderValue?: str
              routingHttpResponseAccessControlExposeHeadersHeaderValue?: str
              routingHttpResponseAccessControlMaxAgeHeaderValue?: str
              routingHttpResponseContentSecurityPolicyHeaderValue?: str
              routingHttpResponseServerEnabled?: bool
              routingHttpResponseStrictTransportSecurityHeaderValue?: str
              routingHttpResponseXContentTypeOptionsHeaderValue?: str
              routingHttpResponseXFrameOptionsHeaderValue?: str
              sslPolicy?: str
              tags?: {str:str}
              tcpIdleTimeoutSeconds?: float

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderTargetGroupArnRef:
              name: str
              namespace?: str
              policy?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderArnRefPolicy

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderTargetGroupArnRefPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderTargetGroupArnSelector:
              matchControllerRef?: bool
              matchLabels?: {str:str}
              namespace?: str
              policy?: Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderArnSelectorPolicy

          schema Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderTargetGroupArnSelectorPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema AutoscalingAwsmUpboundIoV1beta1ScheduleSpecForProviderAutoscalingGroupNameRefPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema AutoscalingAwsmUpboundIoV1beta1ScheduleSpecForProviderAutoscalingGroupNameSelectorPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema AutoscalingAwsmUpboundIoV1beta1ScheduleSpecForProviderAutoscalingGroupNameRef:
              name: str
              namespace?: str
              policy?: AutoscalingAwsmUpboundIoV1beta1ScheduleSpecForProviderAutoscalingGroupNameRefPolicy

          schema AutoscalingAwsmUpboundIoV1beta1ScheduleSpecForProviderAutoscalingGroupNameSelector:
              matchControllerRef?: bool
              matchLabels?: {str:str}
              namespace?: str
              policy?: AutoscalingAwsmUpboundIoV1beta1ScheduleSpecForProviderAutoscalingGroupNameSelectorPolicy

          schema AutoscalingAwsmUpboundIoV1beta1ScheduleSpecForProvider:
              autoscalingGroupName?: str
              autoscalingGroupNameRef?: AutoscalingAwsmUpboundIoV1beta1ScheduleSpecForProviderAutoscalingGroupNameRef
              autoscalingGroupNameSelector?: AutoscalingAwsmUpboundIoV1beta1ScheduleSpecForProviderAutoscalingGroupNameSelector
              desiredCapacity?: float
              endTime?: str
              maxSize?: float
              minSize?: float
              recurrence?: str
              region: str
              startTime?: str
              timeZone?: str

          # Your composite resource (XR) spec schemas, one per kind, e.g. `schema MyKindSpec:`.

          # A public TLS certificate for one domain, issued by ACM and validated through
          # DNS records in a Route 53 hosted zone. CloudFront only accepts certificates
          # from us-east-1, so keep the default region when the certificate is for a
          # CdnDistribution.

          # certificateArn is set once ACM has created the certificate. validated is true
          # once ACM reports the DNS validation as complete.

          # One change to the fleet's size, that AWS applies on a cron schedule. recurrence
          # is a Unix cron expression, for example "0 8 * * MON-FRI" for 08:00 on weekdays,
          # and timeZone is an IANA name such as "Europe/London" (UTC when it is left out).
          # Set at least one of minSize, maxSize or desiredCapacity. A value left out is
          # not changed at that time.
          schema ScalingScheduleSpec:
              name: str
              recurrence: str
              timeZone?: str
              minSize?: int
              maxSize?: int
              desiredCapacity?: int
              check:
                  minSize is not Undefined or maxSize is not Undefined or desiredCapacity is not Undefined, "a scaling schedule must set minSize, maxSize or desiredCapacity"

          # The application part of a web fleet: an auto-scaling group of web instances
          # behind an application load balancer, and what they run. It does not say which
          # network the fleet runs in, so an Environment can supply that.
          # userData is a plain-text bootstrap script (cloud-init or a shell script); the
          # launch template receives it base64-encoded, as EC2 requires.
          schema WebFleetAppSpec:
              name: str
              imageId: str
              instanceType: str = "t3.micro"
              port: int = 80
              healthCheckPath: str = "/"
              minSize: int = 1
              maxSize: int = 2
              userData?: str
              scalingSchedules?: [ScalingScheduleSpec]
              check:
                  minSize <= maxSize, "minSize must not be greater than maxSize"

          # A web fleet placed in a network: WebFleetAppSpec plus the region and the network.
          schema WebFleetSpec(WebFleetAppSpec):
              region: str = "us-east-1"
              network: NetworkSpec

          # loadBalancerDnsName is what a CdnDistribution uses as its origin.
          schema WebFleetStatus:
              loadBalancerArn?: str
              loadBalancerDnsName?: str

          # hostedZoneId is the Route 53 zone that gets an alias record for each alias,
          # pointing it at the distribution. Without it, the aliases are only set on
          # CloudFront and nothing resolves them.
          # A CloudFront distribution in front of an origin (such as the load balancer of
          # a WebFleet). The origin is reached over HTTP, and viewers are redirected to
          # HTTPS. Every request is forwarded to the origin, with caching disabled, since
          # the origin is a dynamic application.

          # The VPC and subnets that resources run in. The subnets must already exist:
          # public ones for internet-facing load balancers, private ones for instances and
          # databases. Two or more in each tier, in different zones.
          schema NetworkSpec:
              vpcId: str
              publicSubnetIds: [str]
              privateSubnetIds: [str]
              check:
                  len(publicSubnetIds) >= 2, "publicSubnetIds needs at least two subnets, in different zones"
                  len(privateSubnetIds) >= 2, "privateSubnetIds needs at least two subnets, in different zones"

          # A VPC to create, from a CIDR block, across two or more zones. Not supported yet:
          # an Environment that asks for one is rejected until the create path exists.
          schema CreateVpcSpec:
              cidrBlock: str
              availabilityZones: [str]
              check:
                  len(availabilityZones) >= 2, "availabilityZones needs at least two zones"

          # An environment's network: a VPC and subnets that already exist (NetworkSpec), or
          # a VPC to create (CreateVpcSpec). Exactly one of the two is given.
          type EnvironmentNetwork = NetworkSpec | CreateVpcSpec

          # An environment, such as prod, that holds a network and the applications that
          # run in it. Each application's AWS names are prefixed with the environment name,
          # so two environments can share a region. Application names must be unique.

          # webFleetDnsNames maps each web fleet's application name to its load balancer's
          # DNS name, for the fleets whose load balancer exists.

          # The address a static website is served at: name is the domain (such as
          # docs.example.com), and hostedZoneId is the Route 53 zone that holds it. The zone
          # gets the certificate's validation records and an alias to the distribution.

          # The bucket that holds the site's files. name must be unique across all of AWS.
          # Only the site's CloudFront distribution may read it.

          # A static website: files in a private S3 bucket, served over HTTPS at the domain
          # by a CloudFront distribution. The certificate is a TlsCertificate for the domain,
          # validated by DNS in the domain's hosted zone.

          # distribution holds what CloudFront reports once it has the distribution: its ARN,
          # and the address it answers on (such as d111111abcdef8.cloudfront.net).

          import base64
          # WebFleet: an auto-scaling group of web instances behind an application load
          # balancer. Each resource waits for the observed values it needs, so the
          # function is staged the same way as the cluster reports them.
          awsResource = lambda apiVersion, kind, name, forProvider -> {str:any} {
              {
                  apiVersion = apiVersion
                  kind = kind
                  metadata.annotations = {"krm.kcl.dev/composition-resource-name" = name}
                  spec.forProvider = forProvider
              }
          }

          composeWebFleet = lambda oxr, ocds -> [any] {
              spec: WebFleetSpec = oxr.spec

              # Bind XR values to locals before building resource dicts (see kcl-primer).
              _name = spec.name
              _region = spec.region
              _vpcId = spec.network.vpcId
              _subnetIds = spec.network.publicSubnetIds
              _instanceSubnetIds = spec.network.privateSubnetIds
              _port = spec.port
              _healthCheckPath = spec.healthCheckPath
              _minSize = spec.minSize
              _maxSize = spec.maxSize
              _imageId = spec.imageId
              _instanceType = spec.instanceType
              _userData = spec.userData
              _scalingSchedules = spec.scalingSchedules or []

              _albSgName = "alb-security-group"
              _instanceSgName = "instance-security-group"
              _albIngressName = "alb-ingress"
              _instanceIngressName = "instance-ingress"
              _albEgressName = "alb-egress"
              _instanceEgressName = "instance-egress"
              _launchTemplateName = "launch-template"
              _loadBalancerName = "load-balancer"
              _targetGroupName = "target-group"
              _listenerName = "listener"
              _autoScalingGroupName = "autoscaling-group"

              _albSgId = ocds[_albSgName]?.Resource?.status?.atProvider?.id
              _instanceSgId = ocds[_instanceSgName]?.Resource?.status?.atProvider?.id
              _targetGroupArn = ocds[_targetGroupName]?.Resource?.status?.atProvider?.arn
              _lbAtProvider = ocds[_loadBalancerName]?.Resource?.status?.atProvider
              _lbArn = _lbAtProvider?.arn
              _lbDnsName = _lbAtProvider?.dnsName
              _launchTemplateId = ocds[_launchTemplateName]?.Resource?.status?.atProvider?.id

              # Ungated: these two security groups are the first things created.
              _albSecurityGroupForProvider: Ec2AwsmUpboundIoV1beta1SecurityGroupSpecForProvider = {
                  name = "${_name}-alb"
                  description = "Load balancer for ${_name}"
                  vpcId = _vpcId
                  region = _region
              }
              _albSecurityGroup = awsResource("ec2.aws.m.upbound.io/v1beta1", "SecurityGroup", _albSgName, _albSecurityGroupForProvider)

              _instanceSecurityGroupForProvider: Ec2AwsmUpboundIoV1beta1SecurityGroupSpecForProvider = {
                  name = "${_name}-instances"
                  description = "Instances of ${_name}"
                  vpcId = _vpcId
                  region = _region
              }
              _instanceSecurityGroup = awsResource("ec2.aws.m.upbound.io/v1beta1", "SecurityGroup", _instanceSgName, _instanceSecurityGroupForProvider)

              # Ungated: the target group needs only the VPC and the port.
              _targetGroups = [awsResource("elbv2.aws.m.upbound.io/v1beta1", "LBTargetGroup", _targetGroupName, Elbv2AwsmUpboundIoV1beta1LBTargetGroupSpecForProvider {
                  name = _name
                  region = _region
                  vpcId = _vpcId
                  port = _port
                  $protocol = "HTTP"
                  targetType = "instance"
                  healthCheck = {path = _healthCheckPath}
              })]

              _albIngressRules = [awsResource("ec2.aws.m.upbound.io/v1beta1", "SecurityGroupRule", _albIngressName, Ec2AwsmUpboundIoV1beta1SecurityGroupRuleSpecForProvider {
                  region = _region
                  securityGroupId = _albSgId
                  $type = "ingress"
                  $protocol = "tcp"
                  fromPort = 80
                  toPort = 80
                  cidrBlocks = ["0.0.0.0/0"]
              })] if _albSgId else []

              _loadBalancers = [awsResource("elbv2.aws.m.upbound.io/v1beta1", "LB", _loadBalancerName, Elbv2AwsmUpboundIoV1beta1LBSpecForProvider {
                  name = _name
                  region = _region
                  loadBalancerType = "application"
                  internal = False
                  subnets = _subnetIds
                  securityGroups = [_albSgId]
              })] if _albSgId else []

              # The user data script is base64-encoded, as the launch template requires.
              # The key is left out entirely when no script is given.
              _launchTemplates = [awsResource("ec2.aws.m.upbound.io/v1beta1", "LaunchTemplate", _launchTemplateName, Ec2AwsmUpboundIoV1beta1LaunchTemplateSpecForProvider {
                  name = _name
                  region = _region
                  imageId = _imageId
                  instanceType = _instanceType
                  vpcSecurityGroupIds = [_instanceSgId]
                  **({"userData" = base64.encode(_userData)} if _userData else {})
              })] if _instanceSgId else []

              _instanceIngressRules = [awsResource("ec2.aws.m.upbound.io/v1beta1", "SecurityGroupRule", _instanceIngressName, Ec2AwsmUpboundIoV1beta1SecurityGroupRuleSpecForProvider {
                  region = _region
                  securityGroupId = _instanceSgId
                  sourceSecurityGroupId = _albSgId
                  $type = "ingress"
                  $protocol = "tcp"
                  fromPort = _port
                  toPort = _port
              })] if _albSgId and _instanceSgId else []

              # Security groups created without egress rules have none: the provider does
              # not keep AWS's default allow-all outbound rule. Both groups need explicit egress.
              _albEgressRules = [awsResource("ec2.aws.m.upbound.io/v1beta1", "SecurityGroupRule", _albEgressName, Ec2AwsmUpboundIoV1beta1SecurityGroupRuleSpecForProvider {
                  region = _region
                  securityGroupId = _albSgId
                  sourceSecurityGroupId = _instanceSgId
                  $type = "egress"
                  $protocol = "tcp"
                  fromPort = _port
                  toPort = _port
              })] if _albSgId and _instanceSgId else []

              _instanceEgressRules = [awsResource("ec2.aws.m.upbound.io/v1beta1", "SecurityGroupRule", _instanceEgressName, Ec2AwsmUpboundIoV1beta1SecurityGroupRuleSpecForProvider {
                  region = _region
                  securityGroupId = _instanceSgId
                  $type = "egress"
                  $protocol = "-1"
                  fromPort = 0
                  toPort = 0
                  cidrBlocks = ["0.0.0.0/0"]
              })] if _instanceSgId else []

              _listeners = [awsResource("elbv2.aws.m.upbound.io/v1beta1", "LBListener", _listenerName, Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProvider {
                  region = _region
                  loadBalancerArn = _lbArn
                  port = 80
                  $protocol = "HTTP"
                  defaultAction = [Elbv2AwsmUpboundIoV1beta1LBListenerSpecForProviderDefaultAction {
                      $type = "forward"
                      targetGroupArn = _targetGroupArn
                  }]
              })] if _lbArn and _targetGroupArn else []

              _autoScalingGroups = [awsResource("autoscaling.aws.m.upbound.io/v1beta1", "AutoscalingGroup", _autoScalingGroupName, AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupSpecForProvider {
                  region = _region
                  vpcZoneIdentifier = _instanceSubnetIds
                  minSize = _minSize
                  maxSize = _maxSize
                  healthCheckType = "ELB"
                  healthCheckGracePeriod = 300
                  launchTemplate = AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupSpecForProviderLaunchTemplate {
                      id = _launchTemplateId
                      version = "$Latest"
                  }
                  trafficSource = [AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupSpecForProviderTrafficSource {
                      identifier = _targetGroupArn
                      $type = "elbv2"
                  }]
              })] if _launchTemplateId and _targetGroupArn else []

              # One scheduled action per scalingSchedules entry, once the ASG exists. Each one
              # finds the fleet's own ASG through its controller reference. AWS treats an
              # omitted size as 0, so a size the consumer left out is sent as -1 (unchanged).
              _scalingScheduleActions = [awsResource("autoscaling.aws.m.upbound.io/v1beta1", "Schedule", "scaling-schedule-${s.name}", AutoscalingAwsmUpboundIoV1beta1ScheduleSpecForProvider {
                  region = _region
                  autoscalingGroupNameSelector = {matchControllerRef = True}
                  recurrence = s.recurrence
                  minSize = s.minSize if s.minSize is not Undefined else -1
                  maxSize = s.maxSize if s.maxSize is not Undefined else -1
                  desiredCapacity = s.desiredCapacity if s.desiredCapacity is not Undefined else -1
                  **({"timeZone" = s.timeZone} if s.timeZone else {})
              }) for s in _scalingSchedules] if _autoScalingGroups else []

              _xr = {
                  apiVersion = oxr.apiVersion
                  kind = oxr.kind
                  metadata = oxr.metadata
                  status = WebFleetStatus {loadBalancerArn = _lbArn, loadBalancerDnsName = _lbDnsName}
              } if _lbDnsName else None

              [_albSecurityGroup, _instanceSecurityGroup] + _targetGroups + _albIngressRules + _loadBalancers + _launchTemplates + _instanceIngressRules + _albEgressRules + _instanceEgressRules + _listeners + _autoScalingGroups + _scalingScheduleActions + ([_xr] if _xr else [])
          }

          _kilnSpecFields = ["healthCheckPath", "imageId", "instanceType", "maxSize", "minSize", "name", "network", "port", "region", "scalingSchedules", "userData"]
          _kilnObservedXr = option("params").oxr
          _kilnOxr = _kilnObservedXr | {spec = {k: v for k, v in _kilnObservedXr.spec if k in _kilnSpecFields}} if _kilnObservedXr?.spec else _kilnObservedXr
          _kilnProviderConfigRef = {kind = "ClusterProviderConfig", name = "pod-identity"}
          _kilnIsManaged = lambda r: any -> bool {
              "forProvider" in (r?.spec or {}) and not (r?.apiVersion or "").startswith("platform.example.com/")
          }
          _kilnWithProviderConfig = lambda r: any -> any {
              r | {spec.providerConfigRef = _kilnProviderConfigRef} if _kilnIsManaged(r) and not r?.spec?.providerConfigRef else r
          }
          items = [_kilnWithProviderConfig(r) for r in composeWebFleet(_kilnOxr, option("params").ocds)]
  - step: auto-ready
    functionRef:
      name: function-auto-ready
