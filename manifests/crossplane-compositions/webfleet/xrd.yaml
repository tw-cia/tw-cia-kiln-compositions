apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: webfleets.platform.demotw.com
spec:
  group: platform.demotw.com
  names:
    kind: WebFleet
    plural: webfleets
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            properties:
              domain:
                properties:
                  hostedZoneId:
                    type: string
                  name:
                    type: string
                required:
                - name
                - hostedZoneId
                type: object
              healthCheckPath:
                default: /
                type: string
              imageId:
                type: string
              instanceType:
                default: t3.micro
                type: string
              maxSize:
                default: 2
                format: int64
                type: integer
              minSize:
                default: 1
                format: int64
                type: integer
              name:
                type: string
              network:
                properties:
                  privateSubnetIds:
                    items:
                      type: string
                    type: array
                  publicSubnetIds:
                    items:
                      type: string
                    type: array
                  vpcId:
                    type: string
                required:
                - vpcId
                - publicSubnetIds
                - privateSubnetIds
                type: object
              port:
                default: 80
                format: int64
                type: integer
              region:
                default: us-east-1
                type: string
              scalingSchedules:
                items:
                  properties:
                    desiredCapacity:
                      format: int64
                      type: integer
                    maxSize:
                      format: int64
                      type: integer
                    minSize:
                      format: int64
                      type: integer
                    name:
                      type: string
                    recurrence:
                      type: string
                    timeZone:
                      type: string
                  required:
                  - name
                  - recurrence
                  type: object
                type: array
              userData:
                type: string
            required:
            - network
            - name
            - domain
            - imageId
            type: object
          status:
            properties:
              loadBalancerArn:
                type: string
              loadBalancerDnsName:
                type: string
            type: object
