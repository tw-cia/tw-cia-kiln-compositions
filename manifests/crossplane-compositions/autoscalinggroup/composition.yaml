              availabilityZoneDistribution?: AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupAtProviderAvailabilityZoneDistribution
              availabilityZones?: [str]
              capacityRebalance?: bool
              capacityReservationSpecification?: AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupAtProviderCapacityReservationSpecification
              context?: str
              defaultCooldown?: float
              defaultInstanceWarmup?: float
              desiredCapacity?: float
              desiredCapacityType?: str
              enabledMetrics?: [str]
              forceDelete?: bool
              forceDeleteWarmPool?: bool
              healthCheckGracePeriod?: float
              healthCheckType?: str
              id?: str
              ignoreFailedScalingActivities?: bool
              initialLifecycleHook?: [AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupAtProviderInitialLifecycleHook]
              instanceLifecyclePolicy?: AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupAtProviderInstanceLifecyclePolicy
              instanceMaintenancePolicy?: AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupAtProviderInstanceMaintenancePolicy
              instanceRefresh?: AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupAtProviderInstanceRefresh
              launchConfiguration?: str
              launchTemplate?: AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupAtProviderLaunchTemplate
              loadBalancers?: [str]
              maxInstanceLifetime?: float
              maxSize?: float
              metricsGranularity?: str
              minElbCapacity?: float
              minSize?: float
              mixedInstancesPolicy?: AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupAtProviderMixedInstancesPolicy
              placementGroup?: str
              predictedCapacity?: float
              protectFromScaleIn?: bool
              region?: str
              serviceLinkedRoleArn?: str
              suspendedProcesses?: [str]
              tag?: [AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupAtProviderTag]
              targetGroupArns?: [str]
              terminationPolicies?: [str]
              trafficSource?: [AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupAtProviderTrafficSource]
              vpcZoneIdentifier?: [str]
              waitForCapacityTimeout?: str
              waitForElbCapacity?: float
              warmPool?: AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupAtProviderWarmPool
              warmPoolSize?: float

          schema AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupSpecForProviderVpcZoneIdentifierRefsPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupSpecForProviderVpcZoneIdentifierSelectorPolicy:
              resolution?: "Required" | "Optional" = "Required"
              resolve?: "Always" | "IfNotPresent"

          schema AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupSpecForProviderWarmPoolInstanceReusePolicy:
              reuseOnScaleIn?: bool

          # Your composite resource (XR) spec schemas, one per kind, e.g. `schema MyKindSpec:`.

          # A DNS-validated ACM certificate. CloudFront only accepts certificates from us-east-1,
          # which is the default.

          # A static website served by CloudFront from a private S3 bucket, behind a custom domain.

          # An auto-scaling group of identical instances, built from a launch template.
          schema AutoScalingGroupSpec:
              region: str = "us-east-1"
              imageId: str
              instanceType: str = "t3.micro"
              subnetIds: [str]
              securityGroupIds?: [str]
              minSize: int = 1
              maxSize: int = 3
              desiredCapacity?: int
              # A plain-text boot script, run by each instance on launch. The function encodes it for AWS.
              userData?: str
              check:
                  minSize <= maxSize, "minSize must not be greater than maxSize"
                  desiredCapacity == Undefined or (desiredCapacity >= minSize and desiredCapacity <= maxSize), "desiredCapacity must be between minSize and maxSize"
                  userData == Undefined or len(userData) <= 16384, "userData must be at most 16 KB"

          schema AutoScalingGroupStatus:
              autoScalingGroupArn?: str

          # An application load balancer serving HTTPS with an existing DNS-validated certificate.

          # A complete web service: a DNS-validated certificate, an auto-scaling group, a load balancer
          # serving HTTPS with that certificate, and a DNS alias from the domain to the load balancer.
          # Everything about a web service except its name: where it runs and what it serves.
          # WebServiceSpec adds the name, and CdnWebServiceSpec nests one of these as its origin.
          schema WebServiceSettings:
              region: str = "us-east-1"
              vpcId: str
              # The load balancer is internet-facing, so it takes public subnets.
              loadBalancerSubnetIds: [str]
              loadBalancerSecurityGroupIds: [str]
              # The instances take private subnets with a route out, so they can install software at boot.
              instanceSubnetIds: [str]
              instanceSecurityGroupIds: [str]
              imageId: str
              instanceType: str = "t3.micro"
              minSize: int = 1
              maxSize: int = 3
              desiredCapacity?: int
              targetPort: int = 80
              # A plain-text boot script for each instance. See AutoScalingGroupSpec.
              userData?: str
              check:
                  len(loadBalancerSubnetIds) >= 2, "the load balancer needs at least two subnets"
                  minSize <= maxSize, "minSize must not be greater than maxSize"
                  desiredCapacity == Undefined or (desiredCapacity >= minSize and desiredCapacity <= maxSize), "desiredCapacity must be between minSize and maxSize"
                  userData == Undefined or len(userData) <= 16384, "userData must be at most 16 KB"

          schema WebServiceSpec(WebServiceSettings):
              domainName: str
              hostedZoneId: str

          # A web service served through CloudFront. The public name is a CloudFront alias with a us-east-1
          # certificate. CloudFront reaches the origin, a WebService at originDomainName, over HTTPS.
          schema CdnWebServiceSpec:
              domainName: str
              hostedZoneId: str
              originDomainName: str
              origin: WebServiceSettings
              check:
                  domainName != originDomainName, "the public name and the origin name must differ"

          import base64
          autoScalingGroupLaunchTemplateName = "launch-template"
          autoScalingGroupGroupName = "auto-scaling-group"

          # Reads the observed launch template through its imported schema, so a misspelt field is a compile error.
          autoScalingGroupLaunchTemplateObserved = lambda atProvider -> Ec2AwsmUpboundIoV1beta1LaunchTemplateStatusAtProvider {
              _status: Ec2AwsmUpboundIoV1beta1LaunchTemplateStatusAtProvider = atProvider
              _status
          }

          # Reads the observed group through its imported schema, so a misspelt field is a compile error.
          autoScalingGroupGroupObserved = lambda atProvider -> AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupStatusAtProvider {
              _status: AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupStatusAtProvider = atProvider
              _status
          }

          composeAutoScalingGroup = lambda oxr, ocds -> [any] {
              spec: AutoScalingGroupSpec = oxr.spec

              # The launch template and the group both take the XR's name, so the cloud objects are easy to find.
              _name = oxr.metadata.name
              _securityGroupIds = spec.securityGroupIds or []
              _userData = spec.userData or ""

              _launchTemplate = {
                  apiVersion = "ec2.aws.m.upbound.io/v1beta1"
                  kind = "LaunchTemplate"
                  metadata.annotations = {
                      "crossplane.io/external-name" = _name
                      "krm.kcl.dev/composition-resource-name" = autoScalingGroupLaunchTemplateName
                  }
                  spec.forProvider = Ec2AwsmUpboundIoV1beta1LaunchTemplateSpecForProvider {
                      region = spec.region
                      imageId = spec.imageId
                      instanceType = spec.instanceType
                      vpcSecurityGroupIds = _securityGroupIds if _securityGroupIds else Undefined
                      # AWS takes the boot script base64-encoded; the consumer writes it as plain text.
                      userData = base64.encode(_userData) if _userData else Undefined
                  }
              }

              _observedLaunchTemplateAtProvider = ocds[autoScalingGroupLaunchTemplateName]?.Resource?.status?.atProvider
              _observedLaunchTemplate = autoScalingGroupLaunchTemplateObserved(_observedLaunchTemplateAtProvider) if _observedLaunchTemplateAtProvider else None
              _launchTemplateId = _observedLaunchTemplate?.id
              _latestVersion = _observedLaunchTemplate?.latestVersion

              # The group is requested only once the launch template has an id and a version to refer to.
              _group = {
                  apiVersion = "autoscaling.aws.m.upbound.io/v1beta1"
                  kind = "AutoscalingGroup"
                  metadata.annotations = {
                      "crossplane.io/external-name" = _name
                      "krm.kcl.dev/composition-resource-name" = autoScalingGroupGroupName
                  }
                  spec.forProvider = AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupSpecForProvider {
                      region = spec.region
                      minSize = spec.minSize
                      maxSize = spec.maxSize
                      desiredCapacity = spec.desiredCapacity if spec.desiredCapacity != None else Undefined
                      vpcZoneIdentifier = spec.subnetIds
                      launchTemplate = AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupSpecForProviderLaunchTemplate {
                          id = _launchTemplateId
                          # Pinned to the template's latest version. A changed template is a new version, which the refresh below rolls to.
                          version = str(int(_latestVersion))
                      }
                      # Replaces the instances whenever the launch template changes, so a new boot script reaches every instance.
                      instanceRefresh = AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupSpecForProviderInstanceRefresh {
                          strategy = "Rolling"
                          triggers = ["launch_template"]
                          preferences = AutoscalingAwsmUpboundIoV1beta1AutoscalingGroupSpecForProviderInstanceRefreshPreferences {
                              minHealthyPercentage = 50
                          }
                      }
                  }
              } if _launchTemplateId and _latestVersion else None

              _observedGroupAtProvider = ocds[autoScalingGroupGroupName]?.Resource?.status?.atProvider
              _observedGroup = autoScalingGroupGroupObserved(_observedGroupAtProvider) if _observedGroupAtProvider else None
              _groupArn = _observedGroup?.arn

              _xr = {
                  apiVersion = oxr.apiVersion
                  kind = oxr.kind
                  metadata = oxr.metadata
                  status = AutoScalingGroupStatus {autoScalingGroupArn = _groupArn}
              } if _groupArn else None

              [_launchTemplate] + ([_group] if _group else []) + ([_xr] if _xr else [])
          }

          _kilnSpecFields = ["desiredCapacity", "imageId", "instanceType", "maxSize", "minSize", "region", "securityGroupIds", "subnetIds", "userData"]
          _kilnObservedXr = option("params").oxr
          _kilnOxr = _kilnObservedXr | {spec = {k: v for k, v in _kilnObservedXr.spec if k in _kilnSpecFields}} if _kilnObservedXr?.spec else _kilnObservedXr
          _kilnProviderConfigRef = {kind = "ClusterProviderConfig", name = "pod-identity"}
          _kilnIsManaged = lambda r: any -> bool {
              "forProvider" in (r?.spec or {}) and not (r?.apiVersion or "").startswith("platform.example.com/")
          }
          _kilnWithProviderConfig = lambda r: any -> any {
              r | {spec.providerConfigRef = _kilnProviderConfigRef} if _kilnIsManaged(r) and not r?.spec?.providerConfigRef else r
          }
          items = [_kilnWithProviderConfig(r) for r in composeAutoScalingGroup(_kilnOxr, option("params").ocds)]
  - step: auto-ready
    functionRef:
