apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: autoscalinggroups.platform.example.com
spec:
  group: platform.example.com
  names:
    kind: AutoScalingGroup
    plural: autoscalinggroups
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            properties:
              desiredCapacity:
                format: int64
                type: integer
              imageId:
                type: string
              instanceType:
                default: t3.micro
                type: string
              maxSize:
                default: 3
                format: int64
                type: integer
              minSize:
                default: 1
                format: int64
                type: integer
              region:
                default: us-east-1
                type: string
              securityGroupIds:
                items:
                  type: string
                type: array
              subnetIds:
                items:
                  type: string
                type: array
              userData:
                type: string
            required:
            - imageId
            - subnetIds
            type: object
          status:
            properties:
              autoScalingGroupArn:
                type: string
            type: object
