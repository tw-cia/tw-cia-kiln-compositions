---
apiVersion: platform.demotw.com/v1alpha1
kind: StaticWebsite
metadata:
  name: test-trololo
spec:
  domainName: test.trololo.demotw.com
  bucketName: test-trololo-demotw-com
  region: us-east-1
  indexDocument: index.html
  errorDocument: 404.html
  tags:
    environment: test
    domain: trololo.demotw.com
---
apiVersion: route53.aws.upbound.io/v1beta1
kind: Record
metadata:
  name: test-trololo-alias
spec:
  forProvider:
    zoneId: Z0510802PA88E7HZZ597
    name: test.trololo.demotw.com
    type: A
    aliasRecord:
      - name: "" # Will be filled by CloudFront distribution name
        zoneId: Z2FDTNDATAQYW2 # CloudFront zone ID (global)
        evaluateTargetHealth: false
